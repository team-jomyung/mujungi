<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- 무중 아이 기기 배경: 아이 방(자체 제작 그림). 창문 · 게시판 · 책장 · 나무 바닥 · 가운데 러그(무중이가 서는 자리) -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3e8"/>
      <stop offset="1" stop-color="#f6e9d8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3b98a"/>
      <stop offset="1" stop-color="#d2a271"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f7"/>
      <stop offset="1" stop-color="#e2f3ff"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fffbe9" stop-opacity="0"/>
    </linearGradient>
    <g id="cloud" fill="#ffffff">
      <ellipse cx="0" cy="0" rx="36" ry="16"/><ellipse cx="-26" cy="6" rx="24" ry="12"/><ellipse cx="28" cy="5" rx="26" ry="13"/><ellipse cx="-4" cy="-12" rx="20" ry="15"/>
    </g>
  </defs>

  <!-- 벽 -->
  <rect width="1600" height="600" fill="url(#wall)"/>
  <rect y="548" width="1600" height="16" fill="#f1dfc8"/>

  <!-- 창문(왼쪽) -->
  <rect x="120" y="100" width="380" height="330" rx="14" fill="#ffffff"/>
  <rect x="140" y="120" width="340" height="290" rx="6" fill="url(#sky)"/>
  <ellipse cx="310" cy="410" rx="230" ry="60" fill="#bfe3a8"/>
  <rect x="140" y="390" width="340" height="20" fill="#bfe3a8"/>
  <use href="#cloud" transform="translate(230 190)"/>
  <use href="#cloud" transform="translate(400 240) scale(0.8)"/>
  <rect x="304" y="120" width="12" height="290" fill="#ffffff"/>
  <rect x="140" y="258" width="340" height="12" fill="#ffffff"/>
  <rect x="104" y="428" width="412" height="18" rx="6" fill="#f3e3cf"/>
  <!-- 커튼 -->
  <path d="M86 84 L176 84 C 166 220 190 360 160 470 L86 470 Z" fill="#ffd9c9" opacity="0.92"/>
  <path d="M534 84 L444 84 C 454 220 430 360 460 470 L534 470 Z" fill="#ffd9c9" opacity="0.92"/>
  <rect x="76" y="76" width="468" height="12" rx="6" fill="#c99a6b"/>

  <!-- 게시판(가운데 오른쪽) -->
  <rect x="930" y="120" width="250" height="170" rx="10" fill="#d9ad78"/>
  <rect x="942" y="132" width="226" height="146" rx="6" fill="#e6c08f"/>
  <rect x="960" y="148" width="54" height="46" fill="#fffdf6" transform="rotate(-4 987 171)"/>
  <rect x="1030" y="144" width="60" height="40" fill="#cfe9ff"/>
  <rect x="1104" y="152" width="48" height="52" fill="#ffe7a8" transform="rotate(5 1128 178)"/>
  <rect x="976" y="210" width="64" height="48" fill="#ffd3e0" transform="rotate(3 1008 234)"/>
  <rect x="1060" y="204" width="56" height="54" fill="#fffdf6" transform="rotate(-3 1088 231)"/>
  <circle cx="987" cy="150" r="4" fill="#e5502f"/><circle cx="1060" cy="146" r="4" fill="#2f7be5"/><circle cx="1128" cy="156" r="4" fill="#03a865"/>

  <!-- 책장(오른쪽) -->
  <rect x="1270" y="250" width="250" height="310" rx="8" fill="#ffffff"/>
  <rect x="1282" y="262" width="226" height="286" fill="#f4ebe0"/>
  <rect x="1282" y="352" width="226" height="10" fill="#ffffff"/>
  <rect x="1282" y="452" width="226" height="10" fill="#ffffff"/>
  <g>
    <rect x="1292" y="290" width="18" height="62" fill="#f28c6b"/><rect x="1312" y="282" width="16" height="70" fill="#6fb8f2"/><rect x="1330" y="296" width="20" height="56" fill="#ffd34d"/>
    <rect x="1352" y="286" width="14" height="66" fill="#8fd16a"/><rect x="1368" y="300" width="22" height="52" fill="#c59be0"/>
    <rect x="1420" y="318" width="60" height="34" rx="6" fill="#d9c2a3"/>
    <rect x="1292" y="392" width="16" height="60" fill="#6fb8f2"/><rect x="1310" y="384" width="20" height="68" fill="#ffb3c7"/><rect x="1332" y="398" width="16" height="54" fill="#f28c6b"/>
    <rect x="1350" y="388" width="18" height="64" fill="#ffd34d"/><rect x="1370" y="396" width="14" height="56" fill="#8fd16a"/>
    <circle cx="1450" cy="432" r="20" fill="#ffffff"/><circle cx="1438" cy="414" r="8" fill="#ffffff"/><circle cx="1462" cy="414" r="8" fill="#ffffff"/>
    <rect x="1296" y="500" width="90" height="48" rx="6" fill="#e6c08f"/><rect x="1400" y="506" width="92" height="42" rx="6" fill="#cfe9ff"/>
  </g>
  <!-- 책장 위 화분 -->
  <rect x="1300" y="214" width="40" height="36" rx="6" fill="#e9b48a"/>
  <ellipse cx="1310" cy="206" rx="14" ry="10" fill="#7cc456"/><ellipse cx="1332" cy="200" rx="14" ry="11" fill="#8fd16a"/><ellipse cx="1320" cy="190" rx="11" ry="12" fill="#6bb84c"/>

  <!-- 바닥 -->
  <rect y="564" width="1600" height="336" fill="url(#floor)"/>
  <g stroke="#c8955f" stroke-width="2" opacity="0.55">
    <line x1="0" y1="606" x2="1600" y2="606"/><line x1="0" y1="656" x2="1600" y2="656"/><line x1="0" y1="716" x2="1600" y2="716"/>
    <line x1="0" y1="786" x2="1600" y2="786"/><line x1="0" y1="866" x2="1600" y2="866"/>
    <line x1="210" y1="564" x2="210" y2="606"/><line x1="690" y1="564" x2="690" y2="606"/><line x1="1180" y1="564" x2="1180" y2="606"/>
    <line x1="420" y1="606" x2="420" y2="656"/><line x1="980" y1="606" x2="980" y2="656"/><line x1="1450" y1="606" x2="1450" y2="656"/>
    <line x1="140" y1="656" x2="140" y2="716"/><line x1="760" y1="656" x2="760" y2="716"/><line x1="1300" y1="656" x2="1300" y2="716"/>
    <line x1="480" y1="716" x2="480" y2="786"/><line x1="1100" y1="716" x2="1100" y2="786"/>
    <line x1="260" y1="786" x2="260" y2="866"/><line x1="900" y1="786" x2="900" y2="866"/><line x1="1500" y1="786" x2="1500" y2="866"/>
  </g>
  <!-- 창으로 드는 빛 -->
  <path d="M160 564 L480 564 L760 860 L240 860 Z" fill="url(#light)"/>

  <!-- 러그(가운데, 무중이가 서는 자리) -->
  <ellipse cx="800" cy="668" rx="330" ry="78" fill="#ffd9c9"/>
  <ellipse cx="800" cy="668" rx="296" ry="64" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.9"/>
  <ellipse cx="800" cy="668" rx="250" ry="50" fill="#ffe7dc"/>

  <!-- 장난감 블록 · 공 -->
  <rect x="310" y="760" width="40" height="40" rx="6" fill="#6fb8f2"/>
  <rect x="356" y="770" width="34" height="30" rx="6" fill="#ffd34d"/>
  <rect x="330" y="726" width="36" height="34" rx="6" fill="#f28c6b"/>
  <circle cx="1240" cy="770" r="30" fill="#ff8f75"/>
  <path d="M1212 762 Q1240 748 1268 762" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- 책 더미 -->
  <rect x="1360" y="812" width="110" height="18" rx="4" fill="#8fd16a"/>
  <rect x="1368" y="794" width="96" height="18" rx="4" fill="#c59be0"/>
  <rect x="1376" y="778" width="84" height="16" rx="4" fill="#ffb3c7"/>
</svg>
