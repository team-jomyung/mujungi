# 무중 Flyway 설정 — realtime 위치 (U1 3.5 Step 11 · J116 · BR8.1 · BR8.2 · SD-13)
#
# migrate 컨테이너(mujoong_owner)가 core 위치 다음에 `flyway -configFiles=/flyway/conf/flyway-realtime.conf migrate`로 쓴다.
# 접속 정보는 이 파일에 없다(비밀 없음, SD-12). migrate 진입 스크립트가 환경 변수로 준다:
#   FLYWAY_URL(jdbc:postgresql://postgres:5432/mujoong) · FLYWAY_USER(mujoong_owner) · FLYWAY_PASSWORD(migrate.env의 DB_OWNER_PASSWORD)
# 시험(test-support MujoongPostgres.flyway)과 같은 값이다. 값을 바꾸면 두 곳을 함께 바꾸고 FlywayConfIT가 대조한다.

# 마이그레이션 SQL 위치(migrate 이미지 안 경로, 원본은 backend/realtime-activity/src/main/resources/db/migration/realtime)
flyway.locations=filesystem:/flyway/sql/realtime
# 이력 표 flyway.realtime_schema_history(J116). 앱 realtime_app은 afterMigrate.sql이 준 SELECT로 이 표만 읽는다
flyway.defaultSchema=flyway
flyway.table=realtime_schema_history
# 관리 스키마: 이력 스키마와 앱 스키마. 스키마는 init(01-roles.sql)이 만들고 Flyway는 만들지 않는다
flyway.schemas=flyway,realtime
flyway.createSchemas=false
# 운영 DB를 지우는 clean은 막는다
flyway.cleanDisabled=true
# core 위치가 먼저 flyway 스키마에 이력 표를 만들었으므로 이 위치는 "비어 있지 않은 스키마 + 이력 표 없음"을 만난다.
# 버전 0 기준선만 남기고 V1부터 그대로 적용한다(J116 보완 · report-g1-b). 0이라 V1을 건너뛰지 않는다
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
# 이름 규칙(V<n>__<설명>.sql · afterMigrate.sql)을 어긴 파일은 무시하지 않고 실패한다
flyway.validateMigrationNaming=true
