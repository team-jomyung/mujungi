# 승인 문구·음성 참조 데이터. core → realtime 스키마 적용 뒤에 실행한다.
# 기존 core/realtime 스키마 이력과 분리해 이미 수동 시딩된 DB에도 도입할 수 있다.
# 001~005 원본은 멱등 SQL이며 이미지 빌드 때 V001~V005 이름으로 포함한다.
flyway.locations=filesystem:/flyway/sql/reference
flyway.defaultSchema=flyway
flyway.table=reference_seed_schema_history
flyway.schemas=flyway,core
flyway.createSchemas=false
flyway.cleanDisabled=true
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.validateMigrationNaming=true
