# 무중 Nginx 공통 프록시 설정 (U1 3.5 Step 44 · BR1.6 · BR8.9 · NFR9.9 · OD-7 · infra-spec 3.3 · LC §2.4 · R4-17)
# 업스트림으로 가는 모든 location이 포함한다. Connection 헤더는 location이 정한다(keepalive는 "", WSS는 업그레이드).
proxy_http_version 1.1;
proxy_set_header Host $host;

# 클라이언트 IP: 이어 붙이지 않고 덮어쓴다(클라이언트가 보낸 X-Forwarded-For는 버려진다). 앱은 Nginx 고정 IP(172.30.10.10)에서
# 온 요청에서만 이 값을 믿는다(server.tomcat.remoteip.internal-proxies).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# 클라이언트가 보낸 다른 전달 헤더는 지운다(빈 값이면 Nginx가 보내지 않는다)
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header Forwarded "";

# 추적 id: 클라이언트 값을 버리고 Nginx 요청 id(32자 16진수)로 덮어쓴다(OD-7). 접근 로그 requestId와 같다
proxy_set_header X-Trace-Id $request_id;

# 시간(연결 3초 · 일반 읽기 · 쓰기 15초)은 443 server 수준에 둔다. 연습 시작 읽기는 35초, WSS는 75초로 덮는다.

# 앱이 직접 낸 오류(준비 전 503 등)는 가로채지 않고 그대로 통과한다(NFR4.13 · R4-17)
proxy_intercept_errors off;
proxy_redirect off;

# 같은 이름 헤더는 Nginx 값으로 통일한다(CSP는 location이 정한다)
proxy_hide_header X-Powered-By;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
