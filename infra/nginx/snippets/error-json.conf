# 무중 Nginx 오류 응답 봉투 (U1 3.5 Step 44 · 편차 (r) · (y) · R4-17 · CD-2 · NFR4.13 · NFR9.9 · contracts/errors.md)
# 443 서비스 호스트 server 수준에서 포함한다. Nginx가 직접 만든 오류만 바꾼다(proxy_intercept_errors off라 앱이 낸 오류는 통과).
#   - 400(원시 URI 검사 · 요청 형식) · 413(본문 64KB 초과 → 상태 400)  → VALIDATION_FAILED
#   - 429(limit_req)                                                  → RATE_LIMITED
#   - 502 · 504(업스트림 접속 불가 · 시간 초과)                        → UPSTREAM_UNAVAILABLE, 상태 코드는 그대로(=503 같은 치환 금지)
# 본문은 오류 봉투 {code, message, traceId}(schemas/error-envelope.schema.json)이고 message는 errors.md의 고정 문장이다.
# traceId와 응답 헤더 X-Trace-Id는 이 요청의 Nginx 요청 id(업스트림에 넘긴 X-Trace-Id와 같은 값)다.
# 화면 경로(/ · /_next/static/)는 location에서 502 · 504를 점검 페이지로 덮는다.
# 오류 문서 location은 internal이라 바깥 요청이 닿지 않는다. 그 안의 client_max_body_size 0은 내부 이동한 요청에 본문 크기 검사를
# 다시 걸지 않으려는 것이다(HTTP/2에서는 첫 413 뒤에도 Content-Length가 남아 오류 문서에서 413이 다시 나 봉투가 사라진다).

error_page 400 /__mujoong/error/400.json;
error_page 413 =400 /__mujoong/error/400.json;
error_page 429 /__mujoong/error/429.json;
error_page 502 /__mujoong/error/502.json;
error_page 504 /__mujoong/error/504.json;

location = /__mujoong/error/400.json {
    internal;
    client_max_body_size 0;
    set $mujoong_csp "default-src 'none'; frame-ancestors 'none'";
    include /etc/nginx/mujoong/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Trace-Id $request_id always;
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    return 400 '{"code":"VALIDATION_FAILED","message":"요청 형식이 올바르지 않아요.","traceId":"$request_id"}';
}

location = /__mujoong/error/429.json {
    internal;
    client_max_body_size 0;
    set $mujoong_csp "default-src 'none'; frame-ancestors 'none'";
    include /etc/nginx/mujoong/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Trace-Id $request_id always;
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    return 429 '{"code":"RATE_LIMITED","message":"잠시 뒤 다시 시도해 주세요.","traceId":"$request_id"}';
}

location = /__mujoong/error/502.json {
    internal;
    client_max_body_size 0;
    set $mujoong_csp "default-src 'none'; frame-ancestors 'none'";
    include /etc/nginx/mujoong/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Trace-Id $request_id always;
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    return 502 '{"code":"UPSTREAM_UNAVAILABLE","message":"지금은 연결할 수 없어요. 잠시 뒤 다시 시도해 주세요.","traceId":"$request_id"}';
}

location = /__mujoong/error/504.json {
    internal;
    client_max_body_size 0;
    set $mujoong_csp "default-src 'none'; frame-ancestors 'none'";
    include /etc/nginx/mujoong/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Trace-Id $request_id always;
    default_type application/json;
    charset utf-8;
    charset_types application/json;
    return 504 '{"code":"UPSTREAM_UNAVAILABLE","message":"지금은 연결할 수 없어요. 잠시 뒤 다시 시도해 주세요.","traceId":"$request_id"}';
}
