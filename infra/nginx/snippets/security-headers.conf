# 무중 Nginx 공통 보안 헤더 (U1 3.5 Step 44 · SD-1 · SD-2 · NFR9.1 · NFR9.12 · NFR10.4 · J75(i))
# 443의 모든 location이 이 파일 하나를 포함한다. add_header는 location 안에 하나라도 있으면 상위 선언을 물려받지 않으므로
# 헤더가 빠지는 location이 없게 모두 같은 파일을 쓴다(SD-1 헤더 중복 방지). 모든 응답(오류 포함)에 붙도록 always.
#   - HSTS: $mujoong_hsts(nginx.conf, max-age=180일, includeSubDomains · preload 없음)
#   - CSP: $mujoong_csp 값. 빈 값이면 Nginx가 헤더를 내지 않는다 → Next.js 경로는 앱이 낸 CSP(nonce)만 남는다(SD-2).
#     API · 정적 음성 · Nginx 오류 응답 location은 "default-src 'none'; frame-ancestors 'none'"로 덮는다.
add_header Strict-Transport-Security $mujoong_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
add_header Content-Security-Policy $mujoong_csp always;
