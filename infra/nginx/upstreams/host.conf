# 무중 Nginx 업스트림 — dev 호스트 배치 (U1 3.5 Step 44 · infra-spec 1.3 dev · compose.dev.yml 프로필 nginx)
# 개발자 PC에서 앱을 IDE · 호스트 프로세스로 돌릴 때 dev Nginx 컨테이너가 호스트(host.docker.internal = 호스트 게이트웨이)의
# 서비스 포트로 보낸다. 앱이 0.0.0.0에 바인드해야 하고, 앱의 신뢰 프록시(SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES)는 dev 망 게이트웨이로 준다.
# demo · 검증 스택에서는 쓰지 않는다. render-nginx --upstreams host가 upstreams.conf로 복사한다.
upstream mujoong_web {
    server host.docker.internal:3000;
    keepalive 16;
}
upstream mujoong_core_api {
    server host.docker.internal:8080;
    keepalive 16;
}
upstream mujoong_realtime {
    server host.docker.internal:8081;
}
