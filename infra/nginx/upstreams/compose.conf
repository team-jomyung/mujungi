# 무중 Nginx 업스트림 — Compose(demo · 검증 스택) 배치 (U1 3.5 Step 44 · infra-spec 2.1 · 3.3 · N-2 · cicd 2.6.3 · NFR4.13 · R4-17 · J347)
# 서비스 이름을 Docker 내장 DNS(127.0.0.11, edge 망)로 1초마다 다시 해석한다(server … resolve, Nginx 1.27.3+ 오픈 소스).
# 앱 컨테이너를 멈추면(docker stop) 그 이름이 풀리지 않아 업스트림이 비고, Nginx가 연결을 기다리지 않고 곧바로 502를 낸다
# (no live upstreams → 오류 봉투 UPSTREAM_UNAVAILABLE, 상태 코드는 그대로, 편차 (y)). 다시 띄우면 재해석 주기 안(약 1 ~ 2초)에 다시 이어진다.
# 예전처럼 고정 IP로 보내면 멈춘 컨테이너 주소로 연결을 3초(proxy_connect_timeout) 기다린 뒤 504가 났다(3.6 IT-06e · IT-06h).
# 남은 위험: 정지 직후 재해석이 반영되기 전(다시 해석 주기 1초 + 해석기 캐시 1초, 3.6 수정 라운드 실측 0.4 ~ 1.8초)에 든 요청은
# 이전 주소로 가서 연결 시간(3초) 뒤 504일 수 있다(J347).
# edge 고정 IP(N-2)는 그대로다 — 이름이 그 고정 IP로 풀리고, 앱의 신뢰 프록시(Nginx 172.30.10.10) · 불변식 7이 그 주소를 쓴다.
# 해석기는 이 망 안의 Docker 내장 DNS뿐이다(바깥 DNS를 쓰지 않는다). zone은 resolve가 요구하는 공유 메모리다.
# Nginx는 관리 포트 9090으로 프록시하지 않는다(BR8.9). render-nginx --upstreams compose(기본)가 upstreams.conf로 복사한다.
resolver 127.0.0.11 valid=1s ipv6=off;
resolver_timeout 1s;

upstream mujoong_web {
    zone mujoong_web 64k;
    server web:3000 resolve;
    keepalive 16;
}
upstream mujoong_core_api {
    zone mujoong_core_api 64k;
    server core-api:8080 resolve;
    keepalive 16;
}
upstream mujoong_realtime {
    zone mujoong_realtime 64k;
    server realtime:8081 resolve;
}
