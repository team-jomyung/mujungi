# 무중 Nginx 업스트림 — Compose(demo · 검증 스택) 배치 (U1 3.5 Step 44 · infra-spec 2.1 · 3.3 · N-2 · cicd 2.6.3)
# edge 망의 고정 IP다. 컨테이너를 다시 만들어도 주소가 바뀌지 않아 Nginx가 이름을 다시 해석할 필요가 없다.
# Nginx는 관리 포트 9090으로 프록시하지 않는다(BR8.9). render-nginx --upstreams compose(기본)가 upstreams.conf로 복사한다.
upstream mujoong_web {
    server 172.30.10.11:3000;
    keepalive 16;
}
upstream mujoong_core_api {
    server 172.30.10.12:8080;
    keepalive 16;
}
upstream mujoong_realtime {
    server 172.30.10.13:8081;
}
