# WebSocket 지원용 (Upgrade 헤더 있으면 upgrade, 없으면 close)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/mujoong.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mujoong.duckdns.org/privkey.pem;

    # 상태 확인용
    location = /healthz {
        return 200 "ok";
    }

    # web (Next.js) — 같은 EC2의 3000 포트
    location / {
        proxy_pass http://172.17.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # /api, /ws/device 는 백엔드 붙일 때 추가
}