# ── 변수 (기존 infra/nginx와 같은 이름) ──
map $host $mujoong_hsts {
    default "max-age=15552000";
}

map $http_upgrade $mujoong_connection_upgrade {
    default upgrade;
    ""      close;
}

# ── 업스트림: Compose 서비스명 대신 EC2 호스트 포트 (bridge) ──
upstream mujoong_core_api {
    server 172.17.0.1:8080;
    keepalive 16;
}

upstream mujoong_realtime {
    server 172.17.0.1:8081;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/mujoong.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mujoong.duckdns.org/privkey.pem;

    # 기존 server 기본값
    set $mujoong_csp "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    location = /healthz {
        return 200 "ok";
    }

    # 연습 시작: Core 상황 준비 30초 + 전송 여유(보호자 요청 시한 35초).
    location = /api/activities/practice {
        set $mujoong_csp "default-src 'none'; frame-ancestors 'none'";
        include /etc/nginx/mujoong/snippets/security-headers.conf;
        include /etc/nginx/mujoong/snippets/proxy-common.conf;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 35s;
        proxy_pass http://mujoong_core_api;
    }

    # 보호자·기기 REST → Core
    location ^~ /api/ {
        set $mujoong_csp "default-src 'none'; frame-ancestors 'none'";
        include /etc/nginx/mujoong/snippets/security-headers.conf;
        include /etc/nginx/mujoong/snippets/proxy-common.conf;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://mujoong_core_api;
    }

    # 기기 WebSocket → Realtime
    location = /ws/device {
        set $mujoong_csp "default-src 'none'; frame-ancestors 'none'";
        include /etc/nginx/mujoong/snippets/security-headers.conf;
        include /etc/nginx/mujoong/snippets/proxy-common.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mujoong_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://mujoong_realtime;
    }

    # 승인 음성은 이미지에 포함한다. 버전별 URL을 유지해 기존 세션도 재생할 수 있다.
    location ^~ /media/approved/ {
        set $mujoong_csp "default-src 'none'; frame-ancestors 'none'";
        include /etc/nginx/mujoong/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        alias /srv/mujoong/approved-audio/;
        autoindex off;
        types {
            audio/wav wav;
        }
        default_type application/octet-stream;
        limit_except GET {
            deny all;
        }
        if ($uri !~ "\\.wav$") {
            return 404;
        }
    }

    # web (Next.js) — 기존 시연 설정 그대로
    location / {
        proxy_pass http://172.17.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $mujoong_connection_upgrade;
    }
}
