# Docker는 데이터 · 백업 볼륨이 마운트된 뒤에만 뜬다 (U1 3.5 Step 47 · infra-spec 1.4 · N-14)
# 설치: /etc/systemd/system/docker.service.d/mujoong-mounts.conf (root 0644), `systemctl daemon-reload`
# 볼륨이 없으면 Docker가 뜨지 않아 빈 루트에 PostgreSQL이 새로 초기화되거나 덤프가 루트 볼륨에 쌓이는 사고를 막는다.
# /etc/fstab은 UUID · noatime,nofail로 두 경로를 마운트한다(RUNBOOK '호스트 기준선').
[Unit]
RequiresMountsFor=/var/lib/mujoong /var/lib/mujoong-backup
