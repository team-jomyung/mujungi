# core-api 기본 설정 (U1 3.5 Step 3)
# - mujoong.* 키 값의 정본: reliability-design.md ## 3 · contracts/timing.md (BR8.11 · RD-24). 소유 앱이 core-api 또는 양 앱인 키만 둔다.
# - 비밀은 환경 변수 이름으로만 받는다(SD-12): SPRING_DATASOURCE_PASSWORD(DB_CORE_PASSWORD를 렌더러가 매핑) ·
#   INTERNAL_SERVICE_TOKEN · MUJOONG_OBSERVABILITY_OWNER_HASH_SECRET · GOOGLE_OAUTH_CLIENT_SECRET(U2). 값은 어느 파일에도 없다.
# - 주소 기본값은 Compose backend 망 이름(postgres · realtime, infra-spec D-12 · J109). 호스트에서 돌릴 때는
#   SPRING_DATASOURCE_URL · MUJOONG_INTERNALHTTP_REALTIMEBASEURL 환경 변수로 바꾼다(J133).
# - mujoong.dev-login.enabled는 어느 프로필 파일에도 true로 쓰지 않는다(환경 변수 MUJOONG_DEVLOGIN_ENABLED, SD-14 · A2).
spring:
  application:
    name: core-api
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://postgres:5432/mujoong
    username: core_app
    hikari:
      pool-name: core-api
      maximum-pool-size: 10
      connection-timeout: 2000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
        jdbc:
          time_zone: UTC
  flyway:
    # 앱은 Flyway를 실행하지 않고 이력 버전만 읽는다. 적용은 migrate 컨테이너(mujoong_owner)가 한다(BR8.1 · BR8.2 · J116)
    enabled: false
  session:
    jdbc:
      initialize-schema: never
      table-name: core_spring_session

server:
  port: 8080
  shutdown: graceful
  server-header: ""
  forward-headers-strategy: native
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    include-path: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: ${mujoong.timing.login.session-idle}
      cookie:
        name: MUJOONG_SESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
        max-age: ${mujoong.security.session-cookie-max-age}
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # 기본은 아무 프록시도 신뢰하지 않는다. Compose가 환경 변수 SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES로
      # Nginx 고정 IP를 정규식으로 이스케이프한 값 하나(172\.30\.10\.10)를 준다(infra-spec 3.3 · BR1.6).
      internal-proxies: "^$"

management:
  server:
    port: 9090
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 100ms,300ms,500ms,1s
        # mujoong_event_delivery_seconds 버킷(observability-design.md 2.5 표, 3.6 수정 J322)
        "[mujoong.event.delivery]": 100ms,250ms,500ms,1s,2s,5s,10s,30s,60s,300s

springdoc:
  api-docs:
    # dev · test 프로필에서만 켠다(tech-stack 2.2). 계약 일치는 contracts/schemas 검증이 본다
    enabled: false

mujoong:
  # JIRA-280 관리자 비용 화면 단가(USD, contracts/ai-io.md 비용 절). 조회할 때 저장된 토큰 · 초에 곱한다. 실제 청구액이 아니다
  admin:
    pricing:
      voice-usd-per-minute: "0.05"
      responses:
        input-usd-per-million: "0.10"
        cached-input-usd-per-million: "0.01"
        cache-write-usd-per-million: "0.125"
        output-usd-per-million: "0.50"
      decisions:
        input-usd-per-million: "0.10"
        cached-input-usd-per-million: "0.01"
        cache-write-usd-per-million: "0.125"
        output-usd-per-million: "0"
  # JIRA-277 Core Luna 사용량 수집. realtime 스위치(MUJOONG_AI_USAGE_ENABLED)와 따로 켠다
  ai-usage:
    enabled: ${MUJOONG_CORE_AI_USAGE_ENABLED:false}
  timing:
    ai-usage:
      flush-interval: 1s
      pending-ttl: 5m
      shutdown-wait: 2s
      write-timeout: 1s
    home-events:
      stream-timeout: 2m
      heartbeat-interval: 10s
      notification-wait: 1s
      reconnect-delay: 1s
    session:
      preparing-timeout: 10s
    core:
      device-status-stale: 30s
    bootstrap:
      code-ttl: 24h
      rate-limit:
        max: 20
        window: 1h
    device:
      register-failure-limit:
        max: 10
        window: 10m
      cookie-max-age: 400d
      # realtime이 소유하는 계약 7절 값. Core는 불변식 I-6 기동 검증에만 읽는다
      status-report-interval: 10s
    login:
      session-idle: 30d
    cache:
      approved-content-ttl: 10m
      policy-version-ttl: 1m
    # U2 계정 삭제 지휘(timing.md 8절 · AC1.6.3)
    account:
      deletion-tick: 5s
      deletion-session-wait: 30s
      google-keys-min-age: 1m
      google-keys-max-age: 6h
    # U5a 연습(timing.md 9절): C10 상황 생성 전체 예산(요청 선점 시한도 같다) · 목표 삭제 뒤 서버 복구 시한
    practice:
      scenario-request-timeout: 30s
      scenario-history-timeout: 500ms
    goal:
      restore-window: 5s
    result:
      job-attempts: 4
      job-retry-backoff: [5s, 15s, 30s]
      job-tick: 1s
      attempt-timeout: 90s
      reconcile-interval: 5m
      undecided-limit: 1h
    report:
      ready-target: 6m
      # 접수부터 고른 활동의 결과 정리를 기다리는 상한과 다시 보는 간격(FT-1023-c)
      result-settle-wait: 5m
      result-settle-poll: 10s
      unsaved-retention: 24h
    push:
      dispatch-poll: 1s
      retry-backoff: [5s, 30s, 2m]
      send-timeout: 5s
      device-status-check: 10s
    # U8(timing.md 13절): 지식 그래프 조회 한 번의 상한. 넘기면 빈 응답(U15가 읽는다, FR9.5)
    knowledge:
      graph-budget: 2s
      graph-initialization-budget: 10s
      # 한 번 장면 참고로 쓴 씨앗을 다시 참고하지 않는 기간(contracts/knowledge-graph.md 참고 씨앗)
      reference-cooldown: 7d
  outbox:
    poll-interval: 500ms
    batch-size: 20
    retry-backoff: [1s, 2s, 4s, 8s, 16s, 30s]
    max-retries: 20
    claim-lease: 30s
    control-event-policy: REARM_ON_START
  inbox:
    poll-interval: 500ms
    retry-backoff: [1s, 2s, 4s, 8s, 16s]
    max-retries: 5
    claim-lease: 30s
    handler-threads: 2
    batch-size: 20
  retention:
    failed-payload: 7d
  cleanup:
    messaging-interval: 24h
    device-expiry-interval: 10m
    expired-device-retention: 7d
    batch-size: 1000
  session:
    timer-tick: 1s
  bootstrap:
    code-draw-attempts: 5
  internal-http:
    realtime-base-url: http://realtime:8081
    connect-timeout: 500ms
    session-start-timeout: 3s
    session-start-retries: 1
    session-end-timeout: 2s
    session-view-timeout: 1s
    admin-facts-timeout: 3s
    event-publish-timeout: 3s
    breaker-failure-threshold: 3
    breaker-open-duration: 5s
  health:
    db-check-interval: 5s
    db-failure-threshold: 3
  limits:
    ai-usage:
      queue-capacity: 1000
      batch-size: 20
    rate-counter-max-keys: 10000
    rest-body-max: 64KB
    internal-event-body-max: 2MB
    background-db-concurrency: 3
    result-workers: 2
    db-lock-timeout: 2s
    db-statement-timeout: 10s
    db-retry-attempts: 2
  security:
    session-cookie-max-age: 30d
    allowed-origin: ${MUJOONG_SECURITY_ALLOWED_ORIGIN:}
    event-log-rate-cap: 60
  dev-login:
    enabled: false
  load-test:
    enabled: false
  metrics:
    db-pool-wait-warn: 100ms
  observability:
    owner-hash-secret: ${MUJOONG_OBSERVABILITY_OWNER_HASH_SECRET:}
    metric-snapshot-interval: 60s
    log-merge-window: 10s
    # OD-6 '앱 안 5초 표본'(CPU · 메모리 · 적체 게이지 갱신) 주기(3.6 수정 J326, reliability-design ## 3에 더할 키)
    system-sample-interval: 5s
  # U2 구글 로그인(U2-J1). 값은 환경 변수로만 받고 비어 있으면 로그인이 401 GOOGLE_AUTH_FAILED다(기동은 막지 않는다).
  # 같은 이름을 web도 읽는다(GOOGLE_OAUTH_CLIENT_ID · GOOGLE_OAUTH_REDIRECT_URI, infra/bin/render-env가 두 env 파일에 쓴다).
  # token-uri · jwks-uri는 https만(평문 http는 루프백 시험 주소만), id_token은 jwks-uri의 공개 열쇠로 서명을 확인한다(U2-J2)
  guardian:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
      token-uri: https://oauth2.googleapis.com/token
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      exchange-timeout: 5s
  # U5a 텍스트 AI(timing.md 9절 · ai-io.md 7절). 기본 공급자는 '사용 불가'이고, 실제 어댑터를 붙일 때 환경 변수
  # MUJOONG_TEXT_AI_ENDPOINT · MUJOONG_TEXT_AI_MODEL · MUJOONG_TEXT_AI_API_KEY 이름을 쓴다(이 파일에는 값을 두지 않는다)
  # 저장 대화 실호출: medium 구조화가 10초를 초과했다. 목적별 none과 유한 시한을 사용하고 검증·분류는 유지한다.
  text-ai:
    request-timeout: 10s
    result:
      # 목표 후보(low)가 긴 대화에서 14~15초까지 걸려 20s에서 40s로 늘렸다. 시도 전체는 timing.result.attempt-timeout(90s)이 막는다(FT-1027-i)
      request-timeout: 40s
      temperature-judgment: 0
      temperature-generation: 0.2
      prompt-version: v1
    retry:
      max-retries: 1
      backoff: 250ms
  # U9 Luna 호출부(contracts/ai-io.md 10.9). 키 env OPENAI_API_KEY가 있을 때만 실제 어댑터가 켜진다(BR1.1, 값은 env에만).
  # 시간 값이 아니다: 시도 시한은 위 text-ai 키를 쓴다(BR5.1). demo · prod는 https + api.openai.com만, test는 루프백만(BR1.4)
  luna:
    model: ${OPENAI_ANALYSIS_MODEL:gpt-6-luna}
    base-url: https://api.openai.com/v1
    max-response-bytes: 1000000
    purpose:
      scenario-generation:
        max-output-tokens: 4000
        reasoning-effort: none
      scenario-review:
        max-output-tokens: 4000
        reasoning-effort: low
      seed-generation:
        max-output-tokens: 4000
        reasoning-effort: medium
      result-text:
        max-output-tokens: 4000
        reasoning-effort: none
      goal-candidates:
        max-output-tokens: 4000
        # none이면 긴 대화에서 질문 한 번 무시를 놓친다. low는 8~15초로 result.request-timeout(40s) 안이다(FT-1027-i)
        reasoning-effort: low
      rejudgment:
        max-output-tokens: 4000
        reasoning-effort: medium
  # 화용 지식 그래프 읽기(Neo4j). 켜려면 KnowledgeGraphLookup 어댑터 빈이 있어야 한다(U5a)
  knowledge:
    neo4j:
      enabled: true
      endpoint: http://neo4j:7474
    seed-generation:
      enabled: true
