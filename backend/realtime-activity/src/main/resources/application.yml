# realtime-activity 기본 설정 (U1 3.5 Step 3)
# - mujoong.* 키 값의 정본: reliability-design.md ## 3 · contracts/timing.md. 소유 앱이 realtime 또는 양 앱인 키만 둔다.
# - 비밀은 환경 변수 이름으로만 받는다(SD-12): SPRING_DATASOURCE_PASSWORD(DB_REALTIME_PASSWORD를 렌더러가 매핑) ·
#   INTERNAL_SERVICE_TOKEN · OPENAI_API_KEY · MUJOONG_OBSERVABILITY_OWNER_HASH_SECRET. 값은 어느 파일에도 없다.
# - 주소 기본값은 Compose backend 망 이름(postgres · core, infra-spec D-12). 호스트에서 돌릴 때는
# SPRING_DATASOURCE_URL · MUJOONG_INTERNALHTTP_COREBASEURL 환경 변수로 바꾼다.
# - mujoong.provider.url은 이 파일에 두지 않는다. 실제 공급자 기본값은 application-demo.yml · application-prod.yml에만 있고,
# 검증 스택 · 시험은 MUJOONG_PROVIDER_URL로 가짜 공급자를 준다. 비어 있으면 기동 점검(S1b)이 거부한다.
spring:
  application:
    name: realtime-activity
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://postgres:5432/mujoong
    username: realtime_app
    hikari:
      pool-name: realtime
      maximum-pool-size: 10
      connection-timeout: 2000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: realtime
        jdbc:
          time_zone: UTC
  flyway:
    # 앱은 Flyway를 실행하지 않고 이력 버전만 읽는다. 적용은 migrate 컨테이너(mujoong_owner)가 한다
    enabled: false

server:
  port: 8081
  shutdown: graceful
  server-header: ""
  forward-headers-strategy: native
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    include-path: never
    whitelabel:
      enabled: false
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # 기본은 아무 프록시도 신뢰하지 않는다. Compose가 환경 변수 SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES로
      # Nginx 고정 IP를 정규식으로 이스케이프한 값 하나(172\.30\.10\.10)를 준다(infra-spec 3.3).
      internal-proxies: "^$"

management:
  server:
    port: 9090
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 100ms,300ms,500ms,1s
        # Realtime 히스토그램 버킷(observability-design.md 2.5 표, 3.6 수정). view_item_ready는 표에 값이 없어
        # 서버 몫 0.5초 · 전체 1.5초를 경계에 넣었다
        "[mujoong.session.start.to.active]": 1s,2s,4s,6s,8s,10s,15s,20s
        "[mujoong.event.delivery]": 100ms,250ms,500ms,1s,2s,5s,10s,30s,60s,300s
        "[mujoong.relay.in]": 10ms,25ms,50ms,100ms,200ms,300ms,500ms,1s
        "[mujoong.relay.out]": 10ms,25ms,50ms,100ms,200ms,300ms,500ms,1s
        "[mujoong.turn.first.audio]": 500ms,1s,1500ms,2s,2500ms,3s,4s,6s,10s
        "[mujoong.view.item.ready]": 50ms,100ms,250ms,500ms,1s,1500ms,2s,5s
        # U13: 제브 지연은 검사 상한 800ms(timing.guardrail.jev-budget)를 경계에 넣었고, 체감 대기는 turn.first.audio와 같은 칸이다
        "[mujoong.guardrail.latency]": 100ms,200ms,300ms,500ms,800ms,1s
        "[mujoong.guardrail.perceived.wait]": 500ms,1s,1500ms,2s,2500ms,3s,4s,6s,10s

mujoong:
  timing:
    session:
      device-ack-timeout: 20s
      closing-confirm: 30s
      # U4b: 참여 창(처음 · 안내 뒤) · 공백 경고 · 공백 종료(계약 7절), 정산 창(7절 밖)
      join-wait: 20s
      join-wait-after-reprompt: 20s
      silence-warning: 4m
      silence-end: 6m
      record-settle: 2s
    device:
      disconnect: 40s
      # U4b: 마지막 기기 메시지 뒤 기술 일시정지 · 끊김 구간 시작(점선 10초)
      gap-display: 10s
      heartbeat-interval: 5s
      hello-timeout: 5s
      status-report-interval: 10s
      # 초 분량(20초 × PCM16 24kHz 모노). 서버 출력 한도에도 쓴다
      output-queue-max: 20s
      # U3: HEARTBEAT 왕복이 이 값을 넘으면 UNSTABLE, 다음 정상 왕복에 CONNECTED(①)
      unstable-rtt: 1s
      # U3: 끊김 횟수를 세는 창. 아래 device.unstable-disconnect-count와 짝(계약 7절 "5분 안 2회")
      unstable-disconnect-window: 5m
    recorder:
      flush-interval: 200ms
    # U8(timing.md 13절): 진행 중 판정 Luna 한 번 상한 · 응답 준비 대기(U11), 제브 검사 상한(U13), 새 연습 흐름(U12).
    # 새 연습 흐름 키는 U5b의 timing.practice(practice/practice-legacy-runtime.yml)와 섞지 않으려고 conversation 아래에 둔다
    judgment:
      # U11: 2s → 4s(사람 결정 2026-10-16, 편차). 실호출 Luna 지연 2.6 · 2.9초를 담는다. contracts/timing.md 13절 · 설정 레코드와 같은 값
      live-budget: 4s
      response-ready: 10s
    guardrail:
      jev-budget: 800ms
    conversation:
      no-response-wait: 10s
      focus-max: 90s
      goal-active-limit: 10m
    # U11(timing.md 14절, 설계 개정 A4 · A7): 값은 실호출 3회 관측 기준 임시값이고 Build and Test 실호출로 확정한다
    provider:
      input-transcript-quiet: 1000ms
      new-speech-margin: 700ms
      # 참여 수락 때 보관한 응답이 비어 있으면 첫 응답 지시 전에 모델이 스스로 답을 시작하기를 기다린다(0이면 바로 지시, 2026-10-22 임시값)
      join-self-start-wait: 1s
      # 자유대화 응답 정체 안전망(JIRA-270): 아이 말 확정 · 미루는 말로 끝난 응답 뒤 이만큼 새 출력 · 아이 말이 없으면 이어 말하기 지시 1회(0이면 끔, 2026-10-23 임시값)
      response-stall-wait: 6s
  outbox:
    poll-interval: 500ms
    batch-size: 20
    retry-backoff: [1s, 2s, 4s, 8s, 16s, 30s]
    max-retries: 20
    claim-lease: 30s
    control-event-policy: REARM_ON_START
  inbox:
    poll-interval: 500ms
    retry-backoff: [1s, 2s, 4s, 8s, 16s]
    max-retries: 5
    claim-lease: 30s
    handler-threads: 2
    batch-size: 20
  retention:
    failed-payload: 7d
  cleanup:
    messaging-interval: 24h
    batch-size: 1000
  session:
    tombstone-ttl: 10m
    orphan-check-interval: 30s
    timer-tick: 1s
    # U4b: 계정 삭제 처리기의 진행 세션 강제 정지 대기 상한
    deletion-stop-wait: 5s
  device:
    disconnect-check-interval: 5s
    unstable-disconnect-count: 2
  internal-http:
    core-base-url: http://core:8080
    connect-timeout: 500ms
    verify-token-timeout: 1s
    device-status-timeout: 1s
    event-publish-timeout: 3s
    status-round-skip-threshold: 3
  provider:
    connect-timeout: 10s
  health:
    db-check-interval: 5s
    db-failure-threshold: 3
  limits:
    ws-text-frame-max: 8KB
    internal-event-body-max: 2MB
    session-input-queue-frames: 50
    session-control-queue: 1000
    device-control-queue: 100
    recorder-queue: 200
    recorder-flush-concurrency: 2
    background-db-concurrency: 3
    db-lock-timeout: 2s
    db-statement-timeout: 10s
    db-retry-attempts: 2
    # U3 원음 기록 대기열(프레임 수, 20ms 프레임 1000개 ≈ 20초). 넘치면 버리고 센다
    recording-queue-frames: 1000
  gate:
    segment-quiet: 800ms
  recording:
    # U3 원음 파일 디렉터리(세션 · 화자당 PCM16LE 24kHz 모노 raw). 컨테이너 루트 파일 시스템이 읽기 전용이라 tmpfs /tmp 아래가
    # 기본값이고, 운영은 MUJOONG_RECORDING_DIRECTORY로 볼륨 경로를 준다. 세션당 상한을 넘으면 그 세션 기록만 멈춘다
    directory: /tmp/mujoong-recordings
    max-bytes-per-session: 64MB
  transcript:
    # U3: 공급자 신뢰도(0 ~ 100)가 이 값보다 낮은 아이 전사는 review_needed(12 '불확실' 표시)
    uncertain-below-percent: 60
  security:
    allowed-origin: ${MUJOONG_SECURITY_ALLOWED_ORIGIN:}
    event-log-rate-cap: 60
  metrics:
    db-pool-wait-warn: 100ms
  observability:
    owner-hash-secret: ${MUJOONG_OBSERVABILITY_OWNER_HASH_SECRET:}
    latency-log-sample-rate: 100
    metric-snapshot-interval: 60s
    log-merge-window: 10s
    # OD-6 '앱 안 5초 표본'(CPU · 메모리 · 풀 · 적체 · 연결 상태 게이지 갱신) 주기(3.6 수정 , Core와 같은 키 · 값)
    system-sample-interval: 5s
  # U11 진행 중 판정 보류 기준(시간 값이 아니다): 1순위 확률 < min-confidence 또는 1 · 2순위 차이 < min-margin이면 판정 보류. 같은 값은 확정
  judgment:
    min-confidence: 0.6
    min-margin: 0.15
  # U12 새 연습 흐름 횟수 한도(contracts/ai-io.md 10.14). 시간 값이 아니다: 시간 한도는 timing.conversation.*(no-response-wait · focus-max · goal-active-limit)
  practice-flow:
    retry-max: 2
    reexplain-max: 1
  # U13 제브 게이트(contracts/ai-io.md 10.12). 시간 값이 아니다: 검사 시한은 timing.guardrail.jev-budget(R-F7). 값은 모두 환경 변수로만 받고 저장소에는 이름만 둔다(R-F3).
  # mode가 비면 프로필 기본값(demo · prod = REAL, 그 밖 = STUB). demo · prod는 REAL + 키 JEV_API_KEY + 허용 호스트 + 고정 모델이 아니면 기동을 거부한다
  guardrail:
    jev:
      mode: ${JEV_MODE:}
      base-url: ${JEV_BASE_URL:}
      model: ${JEV_MODEL:}
      # 통과 문턱(선 형식 정정 D6). PASS가 1순위이고 확률이 이 값 이상일 때만 자동 통과한다. 0 < x <= 1. 임시 시험값 — AI 성능 시험으로 확정한다
      pass-threshold: ${JEV_PASS_THRESHOLD:0.5}
      # JIRA-266: true면 제브 요청 후보 · 맥락의 아이 이름을 '아이'로 바꾸지 않고 원문으로 보낸다(욕설 이름을 제브가 보게). 비밀 아님.
      # R-F15 확인 기록(제브의 아동 이름 전달 허용 범위, infra/RUNBOOK.md) 전에는 켜지 않는다. Luna 등 다른 경로는 언제나 이름을 바꾼다
      send-child-name: ${JEV_SEND_CHILD_NAME:false}
  # U9 Luna 호출부(contracts/ai-io.md 10.9). 키 env OPENAI_API_KEY가 있고 enabled가 true일 때만 RealtimeLunaClient가 켜진다(값은 env에만).
  # 시간 값이 아니다: 시도 시한은 timing.judgment.live-budget. demo · prod는 https + api.openai.com만, test는 루프백만
  luna:
    enabled: false
    model: ${OPENAI_JUDGE_MODEL:gpt-6-luna}
    base-url: https://api.openai.com/v1
    max-response-bytes: 1000000
    purpose:
      judgment-live:
        max-output-tokens: 4000
        reasoning-effort: medium
