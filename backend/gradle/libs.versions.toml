# 무중 백엔드 라이브러리 판 (U1 3.5 Step 3 · J139 · 공유 파일 소유: Step 3 · 5)
# 운영 · 시험 의존성을 여기서 모두 선언한다. 뒤 단계는 이 파일을 고치지 않는다.
# 판 번호가 없는 항목은 Spring Boot BOM(spring-boot-dependencies)이 정한다.
# Boot 4.1 판정(J139)이 실패하면 spring-boot를 3.5.x로 바꾸고 Jackson 좌표(tools.jackson → com.fasterxml)를 함께 바꾼다.

[versions]
spring-boot = "4.1.1"
# springdoc 3.1.x는 Boot 4.1.0으로 빌드된 판이다(dev · test에서만 켬)
springdoc = "3.1.1"
archunit = "1.5.1"
# JSON Schema 2020-12 검증기. 3.0.6은 Jackson 3.1.x로 빌드돼 Boot BOM의 Jackson 3.1과 맞는다
json-schema-validator = "3.0.6"
# 가짜 공급자 시험용 WebSocket 서버(test-support 전용, J110 · J129)
java-websocket = "1.6.0"
jacoco = "0.8.14"
push2u = "0.3.0"
# 보안 패치 판(3.6 수정 라운드 · CI backend-deps Trivy HIGH · CRITICAL). Boot 4.1.1 BOM의 판(Tomcat 11.0.24 ·
# Jackson 3.1.5 · 2.22.1)보다 높여 덮는다(mujoong.java-conventions). Boot BOM이 이 판 이상을 내면 세 줄과 그 사용처를 지운다.
tomcat-security = "11.0.26"
jackson3-security = "3.1.7"
jackson2-security = "2.22.3"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
# 보안 패치 BOM(위 판 설명). Tomcat은 BOM이 없어 conventions에서 판 제약으로 올린다
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3-security" }
jackson2-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson2-security" }

# 운영(두 앱)
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-session-jdbc = { module = "org.springframework.boot:spring-boot-starter-session-jdbc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
postgresql = { module = "org.postgresql:postgresql" }
push2u-core = { module = "com.the13haven:push2u-core", version.ref = "push2u" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }
hikaricp = { module = "com.zaxxer:HikariCP" }
springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }

# contract-model(Spring · JPA 없음, LC-11)
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
logback-classic = { module = "ch.qos.logback:logback-classic" }

# 시험
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-jdbc-test = { module = "org.springframework.boot:spring-boot-starter-jdbc-test" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
mockito-core = { module = "org.mockito:mockito-core" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "java-websocket" }

[bundles]
unit-test = ["junit-jupiter", "assertj-core", "mockito-core", "mockito-junit-jupiter"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
