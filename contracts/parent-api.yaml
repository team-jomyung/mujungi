        장면 결과는 현재 결과의 장면 판정에 Realtime 장면 실행 기록(횟수 · 도움)을 붙인 것이다. 도움 반응은 장면당 한 번만 판정하고
        기록으로 가를 수 없으면 helpOffer=UNKNOWN이다. Realtime 조회가 실패하면 503 REALTIME_UNAVAILABLE이다. 없는 · 진행 중 ·
        삭제 접수된 보호자의 활동은 404다. 열람 기록에는 관리자 · 활동의 해시와 시각만 남고 원문은 남지 않는다.
