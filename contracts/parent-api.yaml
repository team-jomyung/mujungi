      x-unit: U5a
      summary: 소프트 삭제, 복구 시한 반환
      description: 중복 삭제는 첫 복구 시한을 돌려주며 연장하지 않는다. UI 취소 창 동안은 요청 자체를 보내지 않는다.
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "schemas/goal-selection-delete-response.schema.json" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfOrDeletion" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceNotReady" }
  /goal-selections/{goalSelectionId}/restore:
    parameters:
      - { name: goalSelectionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: restoreGoalSelection
      x-unit: U5a
      summary: 삭제 복구 (순서와 즐겨찾기 보존)
      security:
        - session: []
          csrf: []
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema: { $ref: "schemas/goal-selection.schema.json" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfOrDeletion" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceNotReady" }
        "410":
          description: 복구 시한 경과
          x-error-codes: [RESTORE_EXPIRED]
          content:
            application/json:
              schema: { $ref: "schemas/error-envelope.schema.json" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: MUJOONG_SESSION }
    csrf: { type: apiKey, in: header, name: X-CSRF-TOKEN }
  responses:
    Unauthenticated:
      description: 세션 없음 · 만료(BR8.5). CSRF 판정보다 먼저 온다(SD-4 F3b)
      x-error-codes: [UNAUTHENTICATED]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: UNAUTHENTICATED, message: 로그인이 필요해요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    NotFound:
      description: 없는 자원 · 남의 자원(존재를 드러내지 않음, BR8.5) · 꺼진 시험 로그인
      x-error-codes: [NOT_FOUND]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: NOT_FOUND, message: 찾을 수 없어요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    ValidationFailed:
      description: "형식 오류 · JSON 아님 · 본문 64KB 초과(편차 (r) — 413 대신 400)"
      x-error-codes: [VALIDATION_FAILED]
      x-deviation: ["(r)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    CsrfOrDeletion:
      description: CSRF 토큰 · Origin 불일치(편차 (e)) 또는 계정 삭제 접수
      x-error-codes: [CSRF_TOKEN_INVALID, ACCOUNT_DELETION_IN_PROGRESS]
      x-deviation: ["(e)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    AccountDeletion:
      description: 계정 삭제가 접수된 보호자(계약 2절)
      x-error-codes: [ACCOUNT_DELETION_IN_PROGRESS]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    CsrfInvalid:
      description: CSRF 토큰 · Origin 불일치(편차 (e)). 계정 삭제가 접수돼도 부를 수 있는 연산(/auth/logout · DELETE /me)이라 삭제 code는 없다
      x-error-codes: [CSRF_TOKEN_INVALID]
      x-deviation: ["(e)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    ChildNotRegistered:
      description: 아이를 아직 등록하지 않음(계약 3절 /child 404)
      x-error-codes: [CHILD_NOT_REGISTERED]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: CHILD_NOT_REGISTERED, message: 아이 정보가 아직 없어요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    InternalError:
      description: 처리하지 못한 서버 오류. 스택 · 예외 메시지 · 입력값을 담지 않는다(편차 (o))
      x-error-codes: [INTERNAL_ERROR]
      x-deviation: ["(o)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: INTERNAL_ERROR, message: 잠시 문제가 생겼어요. 다시 시도해 주세요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    ServiceNotReady:
      description: 앱이 NOT_READY(DB 점검 연속 실패) 또는 DRAINING(정상 종료 중). 인증 판정보다 먼저 온다(편차 (n))
      x-error-codes: [SERVICE_NOT_READY]
      x-deviation: ["(n)"]
      headers:
        Retry-After:
          description: 초 단위(mujoong.health.db-check-interval, J124)
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: SERVICE_NOT_READY, message: 잠시 뒤 다시 시도해 주세요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
