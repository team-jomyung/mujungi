  /admin/costs:
    get:
      operationId: listAdminCosts
      x-unit: JIRA-280
      summary: API · 비용 — 호출 완료 시각이 기간 안인 사용량의 USD 예상 비용(실제 청구액 아님)
      description: |
        수집된 사용량 가운데 금액을 계산할 수 있는 호출 기준의 예상 비용이다. 저장된 토큰 · 음성 초에 현재 설정 단가
        (mujoong.admin.pricing, contracts/ai-io.md)를 곱하고, 단가를 바꾸면 지난 비용도 새 단가로 다시 계산된다. 토큰 수는 필드마다
        아는 값을 더해 보여 주지만 금액은 입력 · 출력을 모두 아는 호출만 계산하고, 계산하지 못한 호출 수는 totals.unknownCount로
        준다(0원으로 더하지 않음). 저장된 사용량이 없는 합계는 "0"이 아니라 null(확인 불가)이고, nonActivityUsd는 현재 수집 범위에
        들지 않아 늘 null이다. 수집 중 빠져 저장되지 않은 호출과 일부만 수집된 기간의 빠진 대화는 알 수 없다. 캐시 읽기 토큰을 모르는
        호출은 캐시 0으로 계산하고 status=PARTIAL이다. activities는 끝난 활동에 연결된 항목(최근 호출 순)이고, 활동 시각이 기간 안인데
        저장된 사용량이 하나도 없는 활동도 status=NOT_COLLECTED · 금액 null로 들어간다(목록 시각은 활동 시각, JIRA-287). otherCosts는 필터가 없을
        때만 시작 실패 · 연결 미확인 항목이다. 금액은 소수 최대 8자리로 반올림한 문자열이고 반올림한 값을 다시 더하지 않아 목록 합과
        합계가 마지막 자리에서 다를 수 있다. Realtime 조회가 실패하면 503 REALTIME_UNAVAILABLE이다.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: timezone, in: query, required: false, schema: { enum: [Asia/Seoul] } }
        - { name: type, in: query, required: false, schema: { enum: [FREE_TALK, PRACTICE] } }
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 50 } }
        - { name: guardianId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: childId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: deviceId, in: query, required: false, description: 활동을 한 기기(해제된 기기 포함), schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { enum: [COMPLETED, INTERRUPTED, FAILED_TO_START] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 8 } }
      responses:
        "200":
          description: 비용 합계 · 활동 항목 한 쪽 · 기타 항목
