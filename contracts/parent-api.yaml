  # 활성 관리자(core.core_admin_account ACTIVE)인지 확인한다(아니면 403 ADMIN_FORBIDDEN). 화면 가드는 이 검사를 대신하지 않는다.
  # 기간은 Asia/Seoul 날짜 from ~ to(양 끝 포함, 최대 366일). 미확인 값은 null이고 0은 확인된 0이다. 금액은 USD 소수 문자열이다.
  /admin/me:
    get:
      operationId: getAdminIdentity
      x-unit: JIRA-280
      summary: 관리자 확인 — 로그인한 보호자가 활성 관리자인가
      responses:
        "200":
          description: 활성 관리자
          content:
            application/json:
              schema: { $ref: "schemas/admin-me-response.schema.json" }
              example: { displayName: 관리자 3f2a1c, role: ADMIN }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceNotReady" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      x-unit: JIRA-280
      summary: 대시보드 — 시작한 활동 수 · 평균 시간 · 일별 수 · 끝 분류(ENDED_UNCONFIRMED는 정상 종료와 따로)
      description: |
        활동 시각(시작 시각, 시작 전이면 요청 시각)이 기간 안인 끝난 활동만 센다. 활동 수 · 평균 · 일별 수는 시작한 활동만
        (시작 실패 · 참여 거절 제외), endReasons는 시작하지 못한 활동까지 끝 분류별로 센다. 평균 시간은 시작 · 종료 시각이 모두
        있는 활동의 평균이고 없으면 null이다.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: timezone, in: query, required: false, schema: { enum: [Asia/Seoul] } }
        - { name: type, in: query, required: false, schema: { enum: [FREE_TALK, PRACTICE] } }
        - { name: query, in: query, required: false, description: "아이 이름 일부 또는 활동 · 보호자 · 기기 id 앞부분. 로그에 남기지 않는다", schema: { type: string, maxLength: 50 } }
        - { name: guardianId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: childId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: deviceId, in: query, required: false, description: 활동을 한 기기(해제된 기기 포함), schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { enum: [COMPLETED, INTERRUPTED, FAILED_TO_START] } }
      responses:
        "200":
          description: 대시보드 집계
          content:
            application/json:
              schema: { $ref: "schemas/admin-overview-response.schema.json" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/ServiceNotReady" }
