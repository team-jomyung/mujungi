        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AdminRealtimeUnavailable" }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: MUJOONG_SESSION }
    csrf: { type: apiKey, in: header, name: X-CSRF-TOKEN }
  responses:
    Unauthenticated:
      description: 세션 없음 · 만료(BR8.5). CSRF 판정보다 먼저 온다(SD-4 F3b)
      x-error-codes: [UNAUTHENTICATED]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: UNAUTHENTICATED, message: 로그인이 필요해요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    NotFound:
      description: 없는 자원 · 남의 자원(존재를 드러내지 않음, BR8.5) · 꺼진 시험 로그인
      x-error-codes: [NOT_FOUND]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: NOT_FOUND, message: 찾을 수 없어요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    ValidationFailed:
      description: "형식 오류 · JSON 아님 · 본문 64KB 초과(편차 (r) — 413 대신 400)"
      x-error-codes: [VALIDATION_FAILED]
      x-deviation: ["(r)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    ChildInputRejected:
      description: "형식 오류 · JSON 아님 · 본문 64KB 초과(편차 (r) — 413 대신 400), 또는 아이 이름이 공통 욕설 사전에 걸림(CHILD_NAME_NOT_ALLOWED, JIRA-266 · 편차 FT-1023-b)"
      x-error-codes: [VALIDATION_FAILED, CHILD_NAME_NOT_ALLOWED]
      x-deviation: ["(r)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: CHILD_NAME_NOT_ALLOWED, message: 이 이름은 쓸 수 없어요. 다른 이름을 입력해 주세요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    GoalWriteForbidden:
      description: CSRF 오류 · 삭제 접수 또는 생성 목표의 필수 동의 철회
      x-error-codes: [CSRF_TOKEN_INVALID, ACCOUNT_DELETION_IN_PROGRESS, CONSENT_MISSING]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    CsrfOrDeletion:
      description: CSRF 토큰 · Origin 불일치(편차 (e)) 또는 계정 삭제 접수
      x-error-codes: [CSRF_TOKEN_INVALID, ACCOUNT_DELETION_IN_PROGRESS]
      x-deviation: ["(e)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    AccountDeletion:
      description: 계정 삭제가 접수된 보호자(계약 2절)
      x-error-codes: [ACCOUNT_DELETION_IN_PROGRESS]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    CsrfInvalid:
      description: CSRF 토큰 · Origin 불일치(편차 (e)). 계정 삭제가 접수돼도 부를 수 있는 연산(/auth/logout · DELETE /me)이라 삭제 code는 없다
      x-error-codes: [CSRF_TOKEN_INVALID]
      x-deviation: ["(e)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
    ChildNotRegistered:
      description: 아이를 아직 등록하지 않음(계약 3절 /child 404)
      x-error-codes: [CHILD_NOT_REGISTERED]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: CHILD_NOT_REGISTERED, message: 아이 정보가 아직 없어요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    AdminForbidden:
      description: 로그인한 보호자가 활성 관리자가 아님(JIRA-280) 또는 계정 삭제 접수. 관리자 API 전부가 서버에서 검사한다
      x-error-codes: [ADMIN_FORBIDDEN, ACCOUNT_DELETION_IN_PROGRESS]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: ADMIN_FORBIDDEN, message: 관리자만 볼 수 있어요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    AdminRealtimeUnavailable:
      description: 앱 NOT_READY · DRAINING(편차 (n)) 또는 관리자 조회에 필요한 Realtime 내부 조회 실패 · 시간 초과(JIRA-280). 빈 값을 0으로 채워 답하지 않는다
      x-error-codes: [SERVICE_NOT_READY, REALTIME_UNAVAILABLE]
      x-deviation: ["(n)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: REALTIME_UNAVAILABLE, message: 지금은 연결할 수 없어요. 잠시 뒤 다시 시도해 주세요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    InternalError:
      description: 처리하지 못한 서버 오류. 스택 · 예외 메시지 · 입력값을 담지 않는다(편차 (o))
      x-error-codes: [INTERNAL_ERROR]
      x-deviation: ["(o)"]
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: INTERNAL_ERROR, message: 잠시 문제가 생겼어요. 다시 시도해 주세요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
    ServiceNotReady:
      description: 앱이 NOT_READY(DB 점검 연속 실패) 또는 DRAINING(정상 종료 중). 인증 판정보다 먼저 온다(편차 (n))
      x-error-codes: [SERVICE_NOT_READY]
      x-deviation: ["(n)"]
      headers:
        Retry-After:
          description: 초 단위(mujoong.health.db-check-interval, J124)
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "schemas/error-envelope.schema.json" }
          example: { code: SERVICE_NOT_READY, message: 잠시 뒤 다시 시도해 주세요., traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
