# 무중 demo 배포 — 재사용 워크플로(main 병합 자동) + 수동 실행(배포 · 롤백)
# (U1 3.5 Step 50 · cicd-pipeline.md 2.2.1 S4 · S5 · S6 · 2.5.2 · 2.5.3 · 2.6.2 S5b · 2.8 · 2.11 · 2.12 · CD-3 · CD-4 · CD-6 · CD-10 · J92 · J98 · J104)
#
# 소유자: A 계정 · 클라우드 담당(J104). 실명 · 계정은 쓰지 않는다.
#
# 부르는 곳: ci.yml의 deploy 작업(main 병합 뒤 ci-gate 통과, automatic=true) · Actions 화면의 수동 실행(workflow_dispatch: sha 비우면
# main 최신, mode DEPLOY · ROLLBACK, reason 한 줄). 경로는 하나다: OIDC 역할 → SSM 문서 mujoong-deploy → 호스트 /opt/mujoong/bin/deploy.sh.
# 건너뜀(실패 아님, 작업 요약에 대상 SHA를 남긴다):
#   - 저장소 변수 SERVICE_HOST가 비어 있음(도메인 미정, J98)
#   - 자동 실행인데 저장소 변수 AUTO_DEPLOY가 false(동결: 시연 · 11/2 측정 창 · 롤백 중, cicd 2.12). 수동 실행은 동결과 무관하다
#   - D0: 인스턴스가 running이 아니거나 SSM이 1분 간격 최대 5분 동안 Online이 아님(서버 정지, CD-10 · cicd 2.11)
# 배포 뒤 S5b: 러너(호스트 밖)에서 공개 도메인으로 3종 호출(health · /device · WSS 101)과 인증서 만료 20일 이상을 확인한다.
# 실패는 배포 실패 표시이고 자동 롤백은 없다(CD-6). 롤백은 mode=ROLLBACK, sha=<deploy.log의 마지막 result=OK sha>로 수동 실행한다.
# 동시성: 배포 그룹 하나, 진행 중 배포를 취소하지 않고 대기열에는 최신 하나만 남는다(cicd 2.12).
# 권한: 기본 contents: read, id-token: write는 배포 작업만. 저장소 변수(비밀 아님): AWS_REGION · AWS_DEPLOY_ROLE_ARN · DEMO_INSTANCE_ID ·
# SERVICE_HOST · AUTO_DEPLOY. Actions 비밀은 쓰지 않는다(OIDC). 입력값은 env로만 넘기고 스크립트에 직접 끼워 넣지 않는다.

name: deploy

on:
  workflow_call:
    inputs:
      sha:
        description: 배포할 커밋 SHA(40자)
        type: string
        required: true
      mode:
        description: DEPLOY 또는 ROLLBACK
        type: string
        required: false
        default: DEPLOY
      reason:
        description: 한 줄 사유
        type: string
        required: false
        default: ""
      automatic:
        description: main 병합 자동 배포면 true(AUTO_DEPLOY 동결을 따른다)
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      sha:
        description: 배포할 커밋 SHA 40자(비우면 main 최신, ROLLBACK은 필수)
        type: string
        required: false
        default: ""
      mode:
        description: DEPLOY(일반) 또는 ROLLBACK(백업 D2 · migrate D4 건너뜀)
        type: choice
        options: [DEPLOY, ROLLBACK]
        default: DEPLOY
      reason:
        description: 한 줄 사유(비밀 · 개인정보 금지)
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      sha: ${{ steps.plan.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode }}
      comment: ${{ steps.plan.outputs.comment }}
    steps:
      - id: plan
        name: 입력 검증 · 건너뜀 판단
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_MODE: ${{ inputs.mode }}
          IN_REASON: ${{ inputs.reason }}
          AUTOMATIC: ${{ inputs.automatic }}
          SERVICE_HOST: ${{ vars.SERVICE_HOST }}
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          mode="${IN_MODE:-DEPLOY}"
          case "$mode" in DEPLOY | ROLLBACK) ;; *) echo "::error::mode는 DEPLOY 또는 ROLLBACK이다"; exit 1 ;; esac
          sha="$IN_SHA"
          if [ -z "$sha" ]; then
            if [ "$mode" = ROLLBACK ]; then
              echo "::error::ROLLBACK은 sha가 필요하다(deploy.log의 마지막 result=OK sha)"
              exit 1
            fi
            sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha는 40자 소문자 16진수다"
            exit 1
          fi
          # SSM 명령 주석(100자 이하, 제어 문자 없음). 사유는 비밀 · 개인정보가 아니어야 한다
          reason="$(printf '%s' "${IN_REASON:-}" | tr -d '\000-\037\177' | tr -s ' ')"
          comment="mujoong ${mode} ${sha:0:7} ${reason}"
          comment="${comment:0:100}"   # 문자 단위(러너 로캘 UTF-8). SSM 주석은 100자 이하
          skip=false
          why=""
          if [ -z "$SERVICE_HOST" ]; then
            skip=true
            why="저장소 변수 SERVICE_HOST가 비어 있다(도메인 미정, J98)"
          elif [ "$AUTOMATIC" = true ] && [ "${AUTO_DEPLOY,,}" = false ]; then
            skip=true
            why="AUTO_DEPLOY=false(동결, cicd 2.12) — 필요하면 수동 실행"
          fi
          if [ "$skip" = false ]; then
            problems=()
            [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/mujoong-gha-deploy$ ]] || problems+=(AWS_DEPLOY_ROLE_ARN)
            [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || problems+=(DEMO_INSTANCE_ID)
            [[ "$REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || problems+=(AWS_REGION)
            [[ "$SERVICE_HOST" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$ ]] || problems+=(SERVICE_HOST)
            if [ "${#problems[@]}" -gt 0 ]; then
              echo "::error::저장소 변수가 없거나 형식이 틀렸다: ${problems[*]}(RUNBOOK 16절)"
              exit 1
            fi
          fi
          {
            echo "skip=$skip"
            echo "sha=$sha"
            echo "mode=$mode"
            echo "comment=$comment"
          } >>"$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            summary "배포 건너뜀: $why — 대상 SHA ${sha} (mode ${mode})"
          else
            summary "배포 대상: SHA ${sha} · mode ${mode}"
          fi

  deploy:
    name: deploy
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: mujoong-deploy-demo
      cancel-in-progress: false
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      MODE: ${{ needs.plan.outputs.mode }}
      COMMENT: ${{ needs.plan.outputs.comment }}
      INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
      SERVICE_HOST: ${{ vars.SERVICE_HOST }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra/bin
      - name: OIDC로 배포 역할 맡기(장기 키 없음, 1시간 이하)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: mujoong-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ vars.AWS_REGION }}
      - id: d0
        name: D0 서버 · SSM 온라인 확인(1분 간격 최대 5분)
        run: |
          set -euo pipefail
          online=false
          for attempt in 1 2 3 4 5 6; do
            state="$(aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" --include-all-instances \
              --query 'InstanceStatuses[0].InstanceState.Name' --output text 2>/dev/null || echo unknown)"
            ping="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo unknown)"
            echo "확인 $attempt: 인스턴스 $state · SSM $ping"
            if [ "$state" = running ] && [ "$ping" = Online ]; then
              online=true
              break
            fi
            # 정지 · 정지 중이면 기다리지 않는다(서버는 필요할 때만 켠다, J95)
            if [ "$state" = stopped ] || [ "$state" = stopping ]; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 60; fi
          done
          echo "online=$online" >>"$GITHUB_OUTPUT"
          if [ "$online" != true ]; then
            echo "서버 정지 또는 SSM 오프라인 — 배포 건너뜀. 켠 뒤 수동 배포 필요: SHA ${SHA} (mode ${MODE})" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: SSM 배포(mujoong-deploy → /opt/mujoong/bin/deploy.sh)
        if: steps.d0.outputs.online == 'true'
        run: |
          set -euo pipefail
          params="$(jq -cn --arg sha "$SHA" --arg mode "$MODE" '{sha: [$sha], mode: [$mode]}')"
          command_id="$(aws ssm send-command --document-name mujoong-deploy --instance-ids "$INSTANCE_ID" \
            --parameters "$params" --comment "$COMMENT" --timeout-seconds 600 --query Command.CommandId --output text)"
          echo "SSM 명령 id: $command_id"
          status=Pending
          deadline=$(( $(date +%s) + 1080 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending | InProgress | Delayed) continue ;;
              *) break ;;
            esac
          done
          # 호스트 스크립트는 값(비밀)을 출력하지 않는다. 마지막 줄이 DEPLOY_END 한 줄이다(상세는 호스트 deploy-<배포 id>.log)
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -n 20 || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tail -n 20 || true
          echo "SSM 상태: $status" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" != Success ]; then
            echo "::error::배포 실패(SSM $status). 자동 롤백은 없다 — RUNBOOK 6.4"
            exit 1
          fi
      - name: S5b 공개 도메인 3종 호출 · 인증서 만료 20일 이상(호스트 밖 관점)
        if: steps.d0.outputs.online == 'true'
        run: |
          set -euo pipefail
          bash infra/bin/probe-three --host "$SERVICE_HOST" --count 1 --timeout 10
          end="$(openssl s_client -connect "$SERVICE_HOST:443" -servername "$SERVICE_HOST" -verify_return_error </dev/null 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)"
          if [ -z "$end" ]; then
            echo "::error::서빙 인증서를 읽지 못했다(TLS 검증 실패 또는 접속 불가)"
            exit 1
          fi
          days=$(( ( $(date -u -d "$end" +%s) - $(date -u +%s) ) / 86400 ))
          echo "인증서 남은 일수: $days" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$days" -lt 20 ]; then
            echo "::error::인증서 만료가 20일 안이다(RUNBOOK 9절 인증서)"
            exit 1
          fi
