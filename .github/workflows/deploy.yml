# 무중 demo 배포 — ECS(EC2 · bridge) · main 병합 자동 + 수동 실행(DEPLOY · ROLLBACK)
#
# 흐름: OIDC(mujoong-gha-deploy) → 최신 태스크 정의에서 image만 SHA로 교체 → ECS 서비스 갱신
#   DEPLOY  : migrate(종료 코드 0 필수) → core-api · realtime → web → nginx
#   ROLLBACK: migrate 생략, 앱 이미지만 되돌림(설정 · DB 스키마는 복원 안 함)
#
# 전제: 태스크 정의 뼈대는 Terraform, image는 이 워크플로가 관리한다. 등록은 Terraform · 이 워크플로만 하고,
#       Terraform 변경이 끝난 뒤 배포한다(동시 변경 시 설정 누락).
# 복구: 자동 롤백은 서비스별(회로 차단기)뿐이다. 중간 실패 시 요약의 서비스별 상태를 보고 수동 복구한다.
#       ECR은 최근 5개만 보관 → 롤백 가능한 SHA도 그 범위.
# 건너뜀: SERVICE_HOST 비어 있음 · 자동 실행인데 AUTO_DEPLOY=false · ECS 인스턴스 미연결(서버 정지)
# 확인(S5b): /healthz · /parent → 200, /api/health → 200 + status=UP
#       ⚠️ WSS · 인증서 확인 없음 — 음성 경로 정상을 뜻하지 않는다(시연 전 probe-three로 복원)
# 저장소 변수(비밀 아님): AWS_REGION · AWS_DEPLOY_ROLE_ARN · SERVICE_HOST · AUTO_DEPLOY

name: deploy

on:
  workflow_call:
    inputs:
      sha:
        description: 배포할 커밋 SHA(40자)
        type: string
        required: true
      mode:
        description: DEPLOY 또는 ROLLBACK
        type: string
        required: false
        default: DEPLOY
      reason:
        description: 한 줄 사유
        type: string
        required: false
        default: ""
      automatic:
        description: main 병합 자동 배포면 true(AUTO_DEPLOY 동결을 따른다)
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      sha:
        description: 배포할 커밋 SHA 40자(비우면 main 최신, ROLLBACK은 필수)
        type: string
        required: false
        default: ""
      mode:
        description: DEPLOY(일반) 또는 ROLLBACK(migrate 건너뜀, 이미지만 되돌림)
        type: choice
        options: [DEPLOY, ROLLBACK]
        default: DEPLOY
      reason:
        description: 한 줄 사유(비밀 · 개인정보 금지)
        type: string
        required: true

permissions:
  contents: read

env:
  ECS_CLUSTER: mujungi-cluster

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      sha: ${{ steps.plan.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - id: plan
        name: 입력 검증 · 건너뜀 판단
        env:
          IN_SHA: ${{ inputs.sha }}
          IN_MODE: ${{ inputs.mode }}
          IN_REASON: ${{ inputs.reason }}
          AUTOMATIC: ${{ inputs.automatic }}
          SERVICE_HOST: ${{ vars.SERVICE_HOST }}
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          mode="${IN_MODE:-DEPLOY}"
          case "$mode" in DEPLOY | ROLLBACK) ;; *) echo "::error::mode는 DEPLOY 또는 ROLLBACK이다"; exit 1 ;; esac
          sha="$IN_SHA"
          if [ -z "$sha" ]; then
            if [ "$mode" = ROLLBACK ]; then
              echo "::error::ROLLBACK은 sha가 필요하다(마지막으로 정상 배포된 커밋 SHA)"
              exit 1
            fi
            sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha는 40자 소문자 16진수다"
            exit 1
          fi
          reason="$(printf '%s' "${IN_REASON:-}" | tr -d '\000-\037\177' | tr -s ' ')"
          skip=false
          why=""
          if [ -z "$SERVICE_HOST" ]; then
            skip=true
            why="저장소 변수 SERVICE_HOST(CloudFront 도메인)가 비어 있다"
          elif [ "$AUTOMATIC" = true ] && [ "${AUTO_DEPLOY,,}" = false ]; then
            skip=true
            why="AUTO_DEPLOY=false(동결) — 필요하면 수동 실행"
          fi
          if [ "$skip" = false ]; then
            problems=()
            [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/mujoong-gha-deploy$ ]] || problems+=(AWS_DEPLOY_ROLE_ARN)
            [[ "$REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || problems+=(AWS_REGION)
            [[ "$SERVICE_HOST" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$ ]] || problems+=(SERVICE_HOST)
            if [ "${#problems[@]}" -gt 0 ]; then
              echo "::error::저장소 변수가 없거나 형식이 틀렸다: ${problems[*]}"
              exit 1
            fi
          fi
          {
            echo "skip=$skip"
            echo "sha=$sha"
            echo "mode=$mode"
          } >>"$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            summary "배포 건너뜀: $why — 대상 SHA ${sha} (mode ${mode})"
          else
            summary "배포 대상: SHA ${sha} · mode ${mode} · 사유: ${reason:-없음}"
          fi

  deploy:
    name: deploy
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: mujoong-deploy-demo
      cancel-in-progress: false
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      MODE: ${{ needs.plan.outputs.mode }}
      SERVICE_HOST: ${{ vars.SERVICE_HOST }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: OIDC로 배포 역할 맡기(장기 키 없음, 1시간 이하)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: mujoong-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ vars.AWS_REGION }}

      - id: d0
        name: D0 ECS 컨테이너 인스턴스 연결 확인
        run: |
          set -euo pipefail
          arns="$(aws ecs list-container-instances --cluster "$ECS_CLUSTER" --status ACTIVE \
            --query 'containerInstanceArns' --output text)"
          connected=0
          if [ -n "$arns" ] && [ "$arns" != None ]; then
            # shellcheck disable=SC2086
            connected="$(aws ecs describe-container-instances --cluster "$ECS_CLUSTER" --container-instances $arns \
              --query 'length(containerInstances[?agentConnected])' --output text)"
          fi
          echo "연결된 컨테이너 인스턴스: $connected"
          if [ "$connected" -gt 0 ]; then
            echo "online=true" >>"$GITHUB_OUTPUT"
          else
            echo "online=false" >>"$GITHUB_OUTPUT"
            echo "서버 정지(ECS 인스턴스 미연결) — 배포 건너뜀. RDS → EC2 순으로 켠 뒤 수동 배포: SHA ${SHA} (mode ${MODE})" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: 배포할 이미지가 ECR에 있는지 확인
        if: steps.d0.outputs.online == 'true'
        run: |
          set -euo pipefail
          # ROLLBACK은 migrate를 실행하지 않으므로 migrate 이미지를 요구하지 않는다
          names=(core-api realtime web nginx)
          if [ "$MODE" = DEPLOY ]; then
            names+=(migrate)
          fi
          missing=()
          errors=()
          for name in "${names[@]}"; do
            if err="$(aws ecr describe-images --repository-name "mujoong-$name" --image-ids "imageTag=$SHA" 2>&1 >/dev/null)"; then
              continue
            fi
            if grep -q ImageNotFoundException <<<"$err"; then
              missing+=("mujoong-$name")
            else
              # 권한 부족 · 레포 없음 등은 "이미지 없음"과 구분해 남긴다
              errors+=("mujoong-$name: $(head -n 1 <<<"$err")")
            fi
          done
          if [ "${#errors[@]}" -gt 0 ]; then
            printf '::error::ECR 조회 오류(권한 · 레포 확인): %s\n' "${errors[@]}"
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::ECR에 SHA ${SHA} 이미지가 없다: ${missing[*]} (ci.yml images 결과 · 최근 5개 보관 범위 확인)"
          fi
          if [ "${#errors[@]}" -gt 0 ] || [ "${#missing[@]}" -gt 0 ]; then
            exit 1
          fi

      - name: ECS 배포(migrate → backend → web → nginx)
        if: steps.d0.outputs.online == 'true'
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"

          # family의 최신 ACTIVE 리비전에서 대상 컨테이너의 image만 바꿔 새 리비전을 등록하고 ARN을 출력한다.
          # 대상 컨테이너가 정확히 1개가 아니면 등록하지 않고 실패한다(이름 불일치로 옛 이미지가 그대로 등록되는 것 방지).
          register() {
            local family="$1" container="$2" image="$3"
            local raw="$RUNNER_TEMP/td-$1.raw.json" file="$RUNNER_TEMP/td-$1.json"
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition --output json >"$raw" || return 1
            jq -e --arg c "$container" --arg img "$image" '
              if ([.containerDefinitions[] | select(.name == $c)] | length) != 1 then
                error("대상 컨테이너가 정확히 1개가 아니다: " + $c)
              else
                .containerDefinitions |= map(if .name == $c then .image = $img else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)
              end' "$raw" >"$file" || return 1
            aws ecs register-task-definition --cli-input-json "file://$file" \
              --query taskDefinition.taskDefinitionArn --output text || return 1
          }

          deploy() {
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$1" --task-definition "$2" >/dev/null
          }

          # 배포 단계 전체 시간 예산 — job timeout(45분) 안에서 공개 주소 검사 등 여유를 남긴다.
          # AWS 자격 증명은 1시간(역할 최대 세션도 3600초)이라 job timeout을 늘릴 때는 함께 검토할 것.
          deploy_deadline=$((SECONDS + 35 * 60))

          # 서비스가 "이번에 등록한 리비전"으로 COMPLETED 되고 실행 수가 원하는 수와 같은지 확인한다.
          # - 갱신 직후 조회에 새 리비전이 늦게 보일 수 있으므로 최대 90초는 전파를 기다린다.
          # - 새 리비전이 한 번 보인 뒤 이전 리비전으로 바뀌면 회로 차단기 롤백으로 판정한다.
          # - 서비스별 상한 12분, 단 전체 예산을 넘지 않는다.
          verify_service() {
            local service="$1" td="$2" info primary state running desired seen=false
            local appear_deadline=$((SECONDS + 90))
            local deadline=$((SECONDS + 12 * 60))
            if [ "$deadline" -gt "$deploy_deadline" ]; then deadline=$deploy_deadline; fi

            while :; do
              info="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" --output json)"
              primary="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .taskDefinition' <<<"$info")"
              state="$(jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState' <<<"$info")"
              running="$(jq -r '.services[0].runningCount' <<<"$info")"
              desired="$(jq -r '.services[0].desiredCount' <<<"$info")"

              if [ "$primary" = "$td" ]; then
                seen=true
                if [ "$state" = FAILED ]; then break; fi
                if [ "$state" = COMPLETED ] && [ "$running" = "$desired" ]; then
                  break
                fi
              elif [ "$seen" = true ]; then
                break                                   # 새 리비전이 보였다가 이전으로 → 롤백
              elif [ "$SECONDS" -ge "$appear_deadline" ]; then
                break                                   # 90초가 지나도 새 리비전이 안 보임
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then break; fi
              sleep 15
            done

            summary "$service: rollout=$state running=$running/$desired 리비전=${primary##*/} 새리비전확인=$seen"
            if [ "$primary" != "$td" ] || [ "$state" != COMPLETED ] || [ "$running" != "$desired" ]; then
              echo "::error::$service 배포 실패 — 롤백·FAILED·시간 초과·새 리비전 미반영 중 하나(로그: /ecs/$service)"
              return 1
            fi
          }

          # 1. migrate(DEPLOY만) — 종료 코드 0이어야 앱을 배포한다
          if [ "$MODE" = DEPLOY ]; then
            migrate_td="$(register mujoong-migrate migrate "$registry/mujoong-migrate:$SHA")" \
              || { echo "::error::mujoong-migrate 태스크 정의 등록 실패(컨테이너 이름 · 권한 확인)"; exit 1; }
            run="$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$migrate_td" --launch-type EC2 \
              --started-by "gha-${GITHUB_RUN_ID}" --output json)"
            task="$(jq -r '.tasks[0].taskArn // empty' <<<"$run")"
            if [ -z "$task" ]; then
              echo "::error::migrate 태스크를 시작하지 못했다: $(jq -c '.failures' <<<"$run")"
              exit 1
            fi
            waited=true
            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task" || waited=false
            desc="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" --output json)"
            last="$(jq -r '.tasks[0].lastStatus' <<<"$desc")"
            stopped_reason="$(jq -r '.tasks[0].stoppedReason // ""' <<<"$desc")"
            code="$(jq -r '.tasks[0].containers[] | select(.name == "migrate") | (.exitCode // "없음")' <<<"$desc")"
            container_reason="$(jq -r '.tasks[0].containers[] | select(.name == "migrate") | (.reason // "")' <<<"$desc")"
            summary "migrate: 상태=$last 종료코드=$code 대기완료=$waited ${stopped_reason:+중지사유=$stopped_reason} ${container_reason:+컨테이너=$container_reason}"
            if [ "$last" != STOPPED ]; then
              # 마이그레이션 도중 강제 중단은 하지 않는다(스키마 반쯤 적용 방지). 사람이 상태를 확인한다.
              echo "::error::migrate가 대기 시간 안에 끝나지 않았다(상태 $last). 태스크는 중단하지 않았다 — 확인 필요: $task"
              exit 1
            fi
            if [ "$code" != 0 ]; then
              echo "::error::migrate 실패 — 앱 배포를 중단한다"
              aws logs tail /ecs/mujoong-migrate --since 15m 2>/dev/null | tail -n 40 || true
              exit 1
            fi
          else
            summary "ROLLBACK — migrate 건너뜀(이미지만 되돌림, 설정 · 스키마는 유지)"
          fi

          # 2. backend(같은 SHA 묶음)
          core_td="$(register mujoong-core-api core-api "$registry/mujoong-core-api:$SHA")" \
            || { echo "::error::mujoong-core-api 태스크 정의 등록 실패"; exit 1; }
          realtime_td="$(register mujoong-realtime realtime "$registry/mujoong-realtime:$SHA")" \
            || { echo "::error::mujoong-realtime 태스크 정의 등록 실패"; exit 1; }
          deploy mujoong-core-api "$core_td"
          deploy mujoong-realtime "$realtime_td"
          verify_service mujoong-core-api "$core_td"
          verify_service mujoong-realtime "$realtime_td"

          # 3. web → nginx
          web_td="$(register mujoong-web web "$registry/mujoong-web:$SHA")" \
            || { echo "::error::mujoong-web 태스크 정의 등록 실패"; exit 1; }
          deploy mujoong-web "$web_td"
          verify_service mujoong-web "$web_td"

          nginx_td="$(register mujoong-nginx nginx "$registry/mujoong-nginx:$SHA")" \
            || { echo "::error::mujoong-nginx 태스크 정의 등록 실패"; exit 1; }
          deploy mujoong-nginx "$nginx_td"
          verify_service mujoong-nginx "$nginx_td"

          summary "배포 완료: SHA ${SHA} (mode ${MODE})"

      - name: S5b 공개 주소 확인(/healthz · /parent · /api/health)
        if: steps.d0.outputs.online == 'true'
        run: |
          set -euo pipefail
          # curl 성공 여부와 HTTP 코드를 분리한다(연결 실패 시 코드가 000000처럼 합쳐지는 것 방지)
          fetch() {
            local out
            if out="$(curl -sS --connect-timeout 5 --max-time 10 -w '\n%{http_code}' "https://$SERVICE_HOST$1")"; then
              CODE="${out##*$'\n'}"
              BODY="${out%$'\n'*}"
              [[ "$CODE" =~ ^[1-5][0-9]{2}$ ]] || CODE=000
            else
              CODE=000
              BODY=""
            fi
          }
          # $1 경로, $2 판정(ok: 200 / up: 200 + JSON status=UP). CloudFront 전파를 고려해 10초 간격 6회 시도
          check() {
            local path="$1" kind="$2" pass=false
            for attempt in 1 2 3 4 5 6; do
              fetch "$path"
              if [ "$CODE" = 200 ]; then
                if [ "$kind" = ok ] || jq -e '.status == "UP"' >/dev/null 2>&1 <<<"$BODY"; then
                  pass=true
                  break
                fi
              fi
              sleep 10
            done
            echo "$path → $CODE $([ "$pass" = true ] && echo 통과 || echo 실패)" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$pass" = true ]
          }
          failed=0
          check /healthz ok || failed=1
          check /parent ok || failed=1
          check /api/health up || failed=1
          echo "참고: WSS(/ws/device) · 인증서 확인은 아직 없다 — 음성 대화 경로 정상을 뜻하지 않는다" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "::error::공개 주소 확인 실패(CloudFront → nginx → web · core 경로 점검)"
            exit 1
          fi
