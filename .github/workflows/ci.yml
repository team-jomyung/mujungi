# 무중 CI — PR 검사 · main 병합 검사 · 이미지 · 검증 명령 · 배포 호출
# (U1 3.5 Step 50 · cicd-pipeline.md 2.1 ~ 2.4 · 2.13 · 4절 CD-1 · CD-2 · CD-8 · J91 · J103 · J104 · NFR9.10 · NFR9.13)
#
# 소유자: A 계정 · 클라우드 담당(J104). 실명 · 계정은 쓰지 않는다.
#
# PR(main 대상): 변경 경로에 해당하는 필수 검사와 secrets 실행.
# main Push: 필수 검사와 skeleton 실행.
# ci-gate 성공 후 images 빌드·검사·GHCR 게시, images 성공 후 deploy 호출.
# PR에서는 skeleton · images · deploy를 실행하지 않는다.
# contracts/ 또는 .github/ 변경 시 PR용 조건부 검사를 모두 실행한다.
# 단계: S1 PR 검사 → S2 main 병합 커밋에서 같은 검사 → (ci-gate 통과 후) S3 이미지 빌드 · 점검 →
# 운영 6종(core-api · realtime · web · migrate · backup · nginx)을 커밋 SHA 태그로 ECR에 게시 → S4 · S5 배포(deploy.yml).
# 권한: 기본 contents: read. id-token: write는 images(ECR 게시) · 배포 호출 작업만.
#
# skeleton은 CD 연결 작업 동안 임시 비차단 검사로 운영한다.
# 실패 표시는 유지하고 C.log를 수집한다.
# 공개 시연 전 원인 수정·전체 PASS 확인 후 ci-gate에 복원한다.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# PR은 새 커밋이 오면 이전 실행을 취소한다.
# main Push는 실행마다 별도로 검사한다.
# 배포 동시성은 deploy.yml에서 관리한다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # 0.74.0

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_deps: ${{ steps.filter.outputs.backend_deps }}
      frontend: ${{ steps.filter.outputs.frontend }}
      frontend_deps: ${{ steps.filter.outputs.frontend_deps }}
      tools: ${{ steps.filter.outputs.tools }}
      infra: ${{ steps.filter.outputs.infra }}
      skeleton: ${{ steps.filter.outputs.skeleton }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: 경로 필터(PR만)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >>"$GITHUB_OUTPUT"; echo "$1=$2"; }
          case "$EVENT" in
            pull_request)
              changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
              ;;
            *)
              changed="__all__"
              ;;
          esac
          all=false
          if [ "$changed" = "__all__" ] || grep -qE '^(contracts/|\.github/)' <<<"$changed"; then all=true; fi
          has() { [ "$all" = true ] || grep -qE "$1" <<<"$changed"; }
          b=false; f=false; t=false; i=false; d=false
          has '^backend/' && b=true
          has '^frontend/' && f=true
          has '^tools/' && t=true
          has '^(infra/|scripts/)' && i=true
          has '^ci/' && d=true
          out backend "$b"
          out frontend "$f"
          out tools "$t"
          out infra "$i"
          if [ "$b" = true ] || [ "$d" = true ]; then out backend_deps true; else out backend_deps false; fi
          if [ "$f" = true ] || [ "$t" = true ] || [ "$d" = true ]; then out frontend_deps true; else out frontend_deps false; fi
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            out skeleton true
          else
            out skeleton false
          fi

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 실패한 시험은 CI에서만 최대 2회 더 돈다(mujoong.java-conventions, test-retry). 재시도 뒤에도 실패하면 작업이 실패한다.
      # JaCoCo는 보고서만 만들고 하한으로 실패시키지 않는다
      - name: gradle check(단위 · 통합 Testcontainers · ArchUnit · 설정 키 대조 · JaCoCo 보고) · bootJar 시험 클래스 0
        working-directory: backend
        run: ./gradlew --no-daemon clean check verifyBootJarHasNoTestClasses -Pmujoong.test.db=docker
      - name: 시험 · 커버리지 보고서
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-reports
          path: |
            backend/*/build/reports/tests/
            backend/*/build/reports/jacoco/
            backend/*/build/test-results/test/
          retention-days: 14
          if-no-files-found: ignore

  backend-deps:
    name: backend-deps
    needs: changes
    if: needs.changes.outputs.backend_deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 예외 목록 검사(만료 · 형식 오류면 실패)
        run: python3 -I ci/security-gate.py trivyignore ci/security-exceptions.yml >"$RUNNER_TEMP/trivyignore"
      - name: bootJar(운영 의존성이 든 jar)
        working-directory: backend
        run: ./gradlew --no-daemon :core-api:bootJar :realtime-activity:bootJar
      - name: 의존성 취약점(high 이상, 예외 목록만 허용)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jars"
          cp backend/core-api/build/libs/core-api.jar backend/realtime-activity/build/libs/realtime-activity.jar "$RUNNER_TEMP/jars/"
          docker run --rm -v "$RUNNER_TEMP/jars:/scan:ro" -v "$RUNNER_TEMP/trivyignore:/gate/trivyignore:ro" "$TRIVY_IMAGE" \
            rootfs --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignorefile /gate/trivyignore /scan

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint(/parent ↔ /device import 경계 NFR11.1 등)
        run: npx --no-install eslint .
      # 실패한 시험은 CI에서만 최대 2회 더 돈다(vitest.config.ts retry). 커버리지는 보고 전용(하한 없음)
      - name: Vitest + 줄 커버리지 보고
        run: npx --no-install vitest run tests --coverage
      - run: npx --no-install next build
      - name: 브라우저 번들에 키 형식 문자열 · 비밀 변수 이름 0건
        run: |
          set -euo pipefail
          names='POSTGRES_PASSWORD|DB_(OWNER|CORE|REALTIME|BACKUP)_PASSWORD|INTERNAL_SERVICE_TOKEN|OPENAI_API_KEY|JEV_API_KEY|MUJOONG_OBSERVABILITY_OWNER_HASH_SECRET|GOOGLE_OAUTH_CLIENT_SECRET|GHCR_PULL_TOKEN|NEO4J_AUTH|SPRING_DATASOURCE_PASSWORD'
          hits="$( { grep -rlE "$names" .next/static || true; grep -rlE -f <(grep -vE '^(#|$)' ../scripts/verify/secret-patterns.txt) .next/static || true; } | sort -u)"
          if [ -n "$hits" ]; then
            echo "::error::브라우저 번들에 비밀 이름 · 키 형식 문자열: $(echo "$hits" | head -n 5 | paste -sd, -)"
            exit 1
          fi
      - name: 커버리지 보고서
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: 재시도 기록(retries.json — 재시도 횟수 · 최초 실패)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-retries
          path: frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  frontend-deps:
    name: frontend-deps
    needs: changes
    if: needs.changes.outputs.frontend_deps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Node 22에 딸린 npm 10은 폐기 중인 audits/quick 엔드포인트로 떨어져 400 · 503으로 실패한다(JIRA-256).
      # audit만 npm 11 고정 판으로 돌린다(같은 lockfile로 audit · security-gate 정상 확인). 판을 올릴 때는 배포 뒤 2주 이상 지난 판을 고른다
      - name: npm 11 고정 판(audit 엔드포인트)
        run: npm install -g npm@11.21.0 && npm --version
      - name: npm audit(high 이상, 예외 목록만 허용) — frontend · tools
        run: |
          set -euo pipefail
          for dir in frontend tools; do
            # npm audit는 취약점이 있으면 1로 끝난다. 판정은 security-gate가 한다(실행 오류는 거기서 2)
            (cd "$dir" && npm audit --json >"$RUNNER_TEMP/audit-$dir.json") || true
          done
          python3 -I ci/security-gate.py npm-audit ci/security-exceptions.yml "$RUNNER_TEMP/audit-frontend.json" "$RUNNER_TEMP/audit-tools.json"

  tools:
    name: tools
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      # 실패한 시험은 CI에서만 최대 2회 더 돈다(vitest.config.mjs retry). 재시도 기록은 test-results/retries.json
      - name: 시험 도구 시험(가짜 공급자 · 기기 시뮬레이터 · C안 시나리오 · dev-edge · verify 종료 코드)
        run: npx --no-install vitest run tests
      - name: 재시도 기록(retries.json — 재시도 횟수 · 최초 실패)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-retries
          path: tools/test-results/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 추적 파일에 환경 파일 · 인증서 · 키 파일 0건
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|jks|pfx)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::추적 중인 환경 · 키 파일: $(echo "$bad" | paste -sd, -)"
            exit 1
          fi
      - name: 양성 대조 — 실행 때 만든 가짜 키를 gitleaks가 잡아야 한다
        run: |
          set -euo pipefail
          planted="$(mktemp -d)"
          chmod 0755 "$planted"
          # AWS 접근 키 id 모양의 무작위 값(실제 키가 아니다). 값은 출력하지 않는다
          printf 'aws_access_key_id = AKIA%s\n' "$(head -c 400 /dev/urandom | tr -dc 'A-Z2-7' | head -c 16)" >"$planted/planted.txt"
          chmod 0644 "$planted/planted.txt"
          rc=0
          docker run --rm -v "$planted:/scan:ro" -v "$PWD/.gitleaks.toml:/cfg/gitleaks.toml:ro" "$GITLEAKS_IMAGE" \
            dir /scan --no-banner --redact=100 --config /cfg/gitleaks.toml --exit-code 7 >/dev/null 2>&1 || rc=$?
          rm -rf "$planted"
          if [ "$rc" -ne 7 ]; then
            echo "::error::gitleaks가 심어 둔 가짜 키를 찾지 못했다(종료 코드 $rc) — 스캔이 동작하지 않는다"
            exit 1
          fi
      - name: 비밀 스캔(커밋 이력 전체)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --no-banner --redact=100 --config /repo/.gitleaks.toml

  infra-validate:
    name: infra-validate
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 도구 판
        run: |
          docker compose version
          shellcheck --version | head -n 2
          jq --version
      - name: infra-validate(Compose 설정 · 불변식 12 · demo 프로필 · 비밀 분배 · nginx -t · shellcheck · 마이그레이션 · 번들 목록)
        run: bash infra/bin/infra-validate
      - name: 위반 샘플이 거부되는지(CD-8)
        run: bash infra/ci/test-infra-validate.sh
      - name: 호스트 도구 시험(render-env · D3 프로필 · check-since-last · log-hygiene-check)
        run: bash infra/ci/test-host-tools.sh
      - name: Neo4j default runtime and secret isolation
        run: bash infra/ci/test-neo4j-runtime.sh

  images:
    name: images
    needs: ci-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OIDC로 배포 역할 맡기(ECR 게시, 장기 키 없음)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: mujoong-images-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/package-lock.json
      - name: 산출물(bootJar · Next.js standalone · tools 의존성) — 이미지 안에서 빌드하지 않는다
        run: |
          set -euo pipefail
          (cd backend && ./gradlew --no-daemon :core-api:bootJar :realtime-activity:bootJar verifyBootJarHasNoTestClasses)
          (cd frontend && npm ci && npx --no-install next build)
          (cd tools && npm ci)
      - name: 예외 목록 검사(만료 · 형식 오류면 실패)
        run: python3 -I ci/security-gate.py exceptions ci/security-exceptions.yml
      - name: 이미지 빌드(운영 6종 + infra · fake-provider 검사용, 라벨 = 커밋 SHA · 소스 지문)
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=$registry" >>"$GITHUB_ENV"
          bash infra/ci/build-images.sh --registry "$registry" --tag "$GITHUB_SHA" --log-dir "$RUNNER_TEMP/image-logs"
      - name: 이미지 빌드 실패 진단
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-build-logs
          path: ${{ runner.temp }}/image-logs/
          retention-days: 14
          if-no-files-found: ignore
      - name: trivy 실행기(다이제스트 고정 이미지, 로컬 이미지는 docker.sock으로 읽는다)
        # /tmp는 읽기 전용(무시 파일 경로 읽기용)이라 Trivy가 이미지를 내보낼 임시 디렉터리는 쓰기 가능한 TMPDIR로 따로 준다(J353)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/trivy-tmp"
          cat >"$RUNNER_TEMP/bin/trivy" <<'SH'
          #!/usr/bin/env bash
          exec docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/tmp:ro \
            -e TMPDIR=/trivy-tmp -v "$RUNNER_TEMP/trivy-tmp:/trivy-tmp" -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" "$@"
          SH
          chmod 0755 "$RUNNER_TEMP/bin/trivy"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: 이미지 점검 1 ~ 8(cicd 2.3.2)
        run: bash infra/ci/image-checks.sh --registry "$REGISTRY" --tag "$GITHUB_SHA"
      - name: 관문 음성 대조(CD-1 — 가짜 비밀 · 게시 포트 추가 · 틀린 Nginx · 파괴적 마이그레이션 · 경계를 넘는 import)
        run: bash infra/ci/test-gate-negatives.sh
      - name: ECR 게시(이미 있는 태그는 덮어쓰지 않고 실패, 이미지당 최대 3회 시도)
        # 부분 게시(일부만 성공) 뒤 같은 SHA로 재실행하면 사전 조회에서 실패한다.
        # 복구: 새 커밋으로 새 SHA를 만들거나, 부분 게시된 태그를 batch-delete-image로 지운 뒤 재실행한다.
        run: |
          set -euo pipefail
          names=(core-api realtime web migrate backup nginx)

          # 1) 사전 조회: "이미지 없음"만 게시 가능, 그 외 오류(권한 · 레포 · 통신)는 판정 불가로 실패
          for name in "${names[@]}"; do
            err="$RUNNER_TEMP/ecr-describe-$name.err"
            if aws ecr describe-images --region "$AWS_REGION" --repository-name "mujoong-$name" \
                --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>"$err"; then
              echo "::error::이미 있는 태그다(덮어쓰지 않는다): mujoong-$name:$GITHUB_SHA"
              exit 1
            elif grep -Fq 'ImageNotFoundException' "$err"; then
              :
            else
              echo "::error::ECR 사전 조회 실패(권한 · 레포 · 통신 확인): mujoong-$name"
              cat "$err" >&2
              exit 1
            fi
          done

          # 2) 로그인 → 게시(중간 실패에도 로그아웃)
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          for name in "${names[@]}"; do
            ok=false
            for i in 1 2 3; do
              if docker push --quiet "$REGISTRY/mujoong-$name:$GITHUB_SHA"; then
                ok=true
                break
              fi
              if [ "$i" -lt 3 ]; then
                echo "::warning::push 실패 — 다음 시도 대기($i/3): mujoong-$name"
                sleep $((i * 10))
              fi
            done
            if [ "$ok" != true ]; then
              echo "::error::push 실패(3회 시도): mujoong-$name"
              exit 1
            fi
          done

  skeleton:
    name: skeleton
    needs: changes
    if: needs.changes.outputs.skeleton == 'true'
    runs-on: ubuntu-24.04
    # verify.sh 전체 실행의 내부 기한(기본 5400초)보다 길게 둬 verify가 스스로 기한 초과를 보고하게 한다
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/package-lock.json
      - name: 검증 명령 C안(A 정적 · 단위 · 통합 → B 기동 · 3종 호출 → C 기기 시뮬레이터 한 턴 → 사후 단언)
        run: bash scripts/verify.sh --mode compose
      - name: 검증 결과(report.txt — 단계별 한 줄, 비밀 값 없음)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skeleton-report
          path: |
            build/verify/report.txt
            build/verify/logs/A1.log
            build/verify/logs/B.log
            build/verify/logs/C.log
            build/verify/logs/images/
            backend/*/build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
      - name: skeleton 회귀 실패 진단
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skeleton-backend-reports
          path: |
            build/verify/logs/A1.log
            backend/*/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, backend, backend-deps, frontend, frontend-deps, tools, secrets, infra-validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 집계(건너뜀은 허용, 실패 · 취소는 불허)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$RESULTS"
          bad="$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(",")' <<<"$RESULTS")"
          if [ -n "$bad" ]; then
            echo "::error::실패 · 취소된 작업: $bad"
            exit 1
          fi
          if [ "$(jq -r '.changes.result' <<<"$RESULTS")" != success ]; then
            echo "::error::경로 필터 작업이 성공하지 않았다"
            exit 1
          fi

  deploy:
    name: deploy
    needs: [ci-gate, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success' && needs.images.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
      mode: DEPLOY
      reason: main 병합 자동 배포
      automatic: true
